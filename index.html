<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Anchor — GRC spaced repetition</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d7def7">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anchor">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#d7def7; --panel:#eef1fc; --border:#bcc6ea;
    --text:#232a54; --dim:#5c659c; --accent:#9b57c4; --success:#1c9e77;
    --warn:#b07d16; --pad:20px; --gap:26px; --radius:8px;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --title:'Quicksand',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text); font-family:var(--mono);
    font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100vh;
  }
  h1,h2,h3{font-family:var(--title); font-weight:600; letter-spacing:.2px}
  button{font-family:var(--mono); cursor:pointer; color:var(--text)}
  a{color:var(--accent)}
  .dim{color:var(--dim)}
  .accent{color:var(--accent)}
  .success{color:var(--success)}

  /* ---- top bar ---- */
  header{
    display:flex; align-items:center; gap:var(--gap);
    padding:16px var(--pad); border-bottom:1px solid var(--border);
    position:sticky; top:0; background:rgba(215,222,247,.9); backdrop-filter:blur(6px); z-index:10;
    padding-top:calc(16px + env(safe-area-inset-top));
    padding-left:calc(var(--pad) + env(safe-area-inset-left));
    padding-right:calc(var(--pad) + env(safe-area-inset-right));
  }
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--title); font-weight:700; font-size:20px}
  .brand .mark{
    width:26px;height:26px;border-radius:7px;
    background:linear-gradient(135deg,var(--accent),#6a86dd);
    display:grid;place-items:center;font-size:15px;color:#fff;
    box-shadow:0 0 18px rgba(179,122,212,.35);
  }
  nav{display:flex; gap:4px; margin-left:auto; flex-wrap:wrap}
  nav button{
    background:transparent; border:1px solid transparent; color:var(--dim);
    padding:8px 14px; border-radius:var(--radius); font-size:13px; font-weight:500;
  }
  nav button:hover{color:var(--text); background:var(--panel)}
  nav button.active{color:var(--text); background:var(--panel); border-color:var(--border)}
  .streak-pill{
    display:flex;align-items:center;gap:6px;background:var(--panel);
    border:1px solid var(--border);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500;
  }

  /* ---- layout ---- */
  main{flex:1; width:100%; max-width:1040px; margin:0 auto; padding:var(--gap) var(--pad) 60px}
  .view{display:none; animation:fade .25s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:var(--pad)}
  .grid{display:grid; gap:var(--gap)}
  .row{display:flex; gap:var(--gap); flex-wrap:wrap}

  .section-title{font-size:12px; text-transform:uppercase; letter-spacing:1.5px; color:var(--dim); margin-bottom:14px; font-family:var(--mono); font-weight:500}

  /* buttons */
  .btn{
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    padding:11px 18px; border-radius:var(--radius); font-size:13px; font-weight:500;
    transition:border-color .15s, transform .05s;
  }
  .btn:hover{border-color:var(--dim)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{
    background:linear-gradient(135deg,var(--accent),#6a86dd); border-color:transparent; color:#fff; font-weight:600;
    box-shadow:0 4px 20px rgba(179,122,212,.28);
  }
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.big{padding:16px 30px; font-size:15px}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.4; cursor:not-allowed}

  /* ---- dashboard ---- */
  .hero{
    display:flex; align-items:center; justify-content:space-between; gap:var(--gap);
    background:
      radial-gradient(120% 140% at 100% 0%, rgba(179,122,212,.14), transparent 55%),
      var(--panel);
    border:1px solid var(--border); border-radius:var(--radius); padding:30px var(--pad);
  }
  .hero .big-num{font-family:var(--title); font-size:52px; font-weight:700; line-height:1; color:var(--accent)}
  .hero-stats{display:flex; gap:36px; margin-top:6px}
  .hero-stats .n{font-family:var(--title); font-size:24px; font-weight:600}
  .hero-stats .l{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--dim)}

  .deck-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px}
  .deck-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; display:flex; gap:16px; align-items:center; transition:border-color .15s;
  }
  .deck-card:hover{border-color:var(--dim)}
  .deck-card.clickable{cursor:pointer}
  .deck-card.clickable:hover{border-color:var(--accent)}
  .deck-card.clickable:hover .deck-go{color:var(--accent); transform:translateX(3px)}
  .deck-go{color:var(--dim); font-size:20px; flex-shrink:0; transition:transform .15s, color .15s}
  .deck-card .meta{flex:1; min-width:0}
  .deck-card h3{font-size:15px; margin-bottom:3px; display:flex; align-items:center; gap:6px}
  .deck-card .counts{font-size:12px; color:var(--dim); display:flex; gap:12px; margin-top:8px}
  .deck-card .counts b{color:var(--text); font-weight:500}
  .badge{font-size:9px; padding:2px 6px; border-radius:4px; text-transform:uppercase; letter-spacing:.5px; font-weight:600}
  .badge.star{background:rgba(179,122,212,.16); color:var(--accent)}
  .badge.adj{background:rgba(224,179,78,.14); color:var(--warn)}
  .badge.due{background:rgba(95,216,143,.15); color:var(--success)}

  /* progress ring */
  .ring{position:relative; width:52px; height:52px; flex-shrink:0}
  .ring svg{transform:rotate(-90deg)}
  .ring .val{position:absolute; inset:0; display:grid; place-items:center; font-size:11px; font-weight:600}

  /* ---- study view ---- */
  .study-wrap{max-width:640px; margin:0 auto}
  .progress-bar{height:5px; background:var(--border); border-radius:99px; overflow:hidden; margin-bottom:20px}
  .progress-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),#6a86dd); transition:width .3s}
  .study-meta{display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin-bottom:14px}
  .card-scene{perspective:1600px; margin-bottom:20px}
  .flashcard{
    position:relative; width:100%; min-height:300px; transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1); cursor:pointer;
  }
  .flashcard.flipped{transform:rotateY(180deg)}
  .face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:34px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;
  }
  .face.back{transform:rotateY(180deg); align-items:stretch; justify-content:flex-start; text-align:left}
  .face .deck-tag{position:absolute; top:16px; left:20px; font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1px}
  .face .hint{position:absolute; bottom:16px; font-size:12px; color:var(--warn)}
  .front-q{font-family:var(--title); font-size:24px; font-weight:600; line-height:1.35}
  .flip-cue{position:absolute; bottom:16px; right:20px; font-size:11px; color:var(--dim)}
  .back h3{font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--accent); margin-bottom:10px}
  .back .answer{font-size:16px; margin-bottom:18px}
  .back .why{border-top:1px solid var(--border); padding-top:14px; font-size:13px; color:var(--dim)}
  .back .why b{color:var(--success); font-weight:500}
  .back .tags{position:absolute; bottom:14px; left:34px; display:flex; gap:6px; flex-wrap:wrap}
  .tag{font-size:10px; color:var(--dim); background:var(--bg); border:1px solid var(--border); padding:2px 7px; border-radius:4px}

  .rate-row{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
  .rate{
    padding:14px 8px; border-radius:var(--radius); border:1px solid var(--border); background:var(--panel);
    display:flex; flex-direction:column; align-items:center; gap:3px; transition:transform .05s, border-color .15s;
  }
  .rate:hover{border-color:var(--dim)}
  .rate:active{transform:translateY(1px)}
  .rate .k{font-size:10px; color:var(--dim)}
  .rate .lbl{font-weight:600; font-size:14px}
  .rate .nxt{font-size:10px; color:var(--dim)}
  .rate.again .lbl{color:#dc4a4a} .rate.hard .lbl{color:var(--warn)}
  .rate.good .lbl{color:var(--success)} .rate.easy .lbl{color:#8fb3ff}
  .linkbtn{background:none;border:none;color:var(--accent);font-family:var(--mono);font-size:12px;padding:0;cursor:pointer}
  .linkbtn:hover{text-decoration:underline}

  /* quiz — multiple choice */
  .quiz-q{font-family:var(--title); font-size:22px; font-weight:600; line-height:1.4; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:26px; margin-bottom:16px}
  .quiz-opts{display:flex; flex-direction:column; gap:10px}
  .quiz-opt{
    display:flex; align-items:flex-start; gap:12px; text-align:left; width:100%;
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius); padding:14px 16px; font-size:14px; line-height:1.45; transition:border-color .15s, background .15s;
  }
  .quiz-opt:hover:not(:disabled){border-color:var(--accent)}
  .quiz-opt .opt-k{flex-shrink:0; width:22px; height:22px; border-radius:5px; background:var(--bg); border:1px solid var(--border); display:grid; place-items:center; font-size:11px; color:var(--dim)}
  .quiz-opt.correct{border-color:var(--success); background:rgba(95,216,143,.1)}
  .quiz-opt.correct .opt-k{background:var(--success); color:#fff; border-color:var(--success)}
  .quiz-opt.wrong{border-color:#dc4a4a; background:rgba(248,113,113,.1)}
  .quiz-opt.wrong .opt-k{background:#dc4a4a; color:#fff; border-color:#dc4a4a}
  .quiz-opt.muted{opacity:.5}
  .quiz-opt:disabled{cursor:default}
  .quiz-feedback{margin-top:18px; padding:16px; border-radius:var(--radius); border:1px solid var(--border); font-size:13px; text-align:center}
  .quiz-feedback.ok{border-color:var(--success)} .quiz-feedback.ok b{color:var(--success)}
  .quiz-feedback.no{border-color:#dc4a4a} .quiz-feedback.no b{color:#dc4a4a}
  .btn.full{width:100%; text-align:center; margin-top:16px}
  .answer-panel{background:var(--panel); border:1px solid var(--success); border-radius:var(--radius); padding:20px; margin:16px 0; position:relative}
  .answer-panel .ap-verdict{font-size:14px; margin-bottom:12px}
  .answer-panel .answer{font-size:16px; margin-bottom:14px}
  .answer-panel .why{border-top:1px solid var(--border); padding-top:12px; font-size:13px; color:var(--dim)}
  .answer-panel .why b{color:var(--success); font-weight:500}
  .answer-panel .tags{position:static; display:flex; gap:6px; flex-wrap:wrap; margin-top:12px}
  .rate .lbl{font-weight:600; font-size:15px}
  .quiz-review{max-width:640px; margin:0 auto; text-align:left}
  .miss-card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px}
  .miss-card .q{font-weight:600; margin-bottom:6px}
  .miss-card .a{color:var(--dim); font-size:13px}

  /* hero actions */
  .hero-actions{display:flex; flex-direction:column; gap:10px; flex-shrink:0}

  /* stats */
  .stat-tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px}
  .stat-tile{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px}
  .stat-tile .st-n{font-family:var(--title); font-size:30px; font-weight:700; line-height:1}
  .stat-tile .st-l{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin-top:6px}
  .bar-chart{display:flex; align-items:flex-end; gap:6px; height:120px}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:5px}
  .bar{width:100%; max-width:26px; background:var(--border); border-radius:4px 4px 0 0; transition:height .3s; min-height:3px}
  .bar-lbl{font-size:10px; color:var(--dim); height:12px}
  .state-bar{display:flex; height:26px; border-radius:6px; overflow:hidden; gap:2px}
  .state-bar .seg{transition:flex .3s}
  .seg.new{background:var(--dim)} .seg.learning{background:var(--warn)} .seg.mastered{background:var(--success)}
  .state-legend{display:flex; gap:20px; margin-top:12px; font-size:12px; color:var(--dim); flex-wrap:wrap}
  .state-legend .dot{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:middle}
  .dot.new{background:var(--dim)} .dot.learning{background:var(--warn)} .dot.mastered{background:var(--success)}
  .recap-cta{display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap}
  .info-box p{font-size:13px; color:var(--dim); margin-bottom:12px; line-height:1.6}
  .info-box p:last-child{margin-bottom:0}
  .info-box b{color:var(--text); font-weight:500}
  .info-box code{background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:1px 5px; font-size:12px}
  .sync-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .sync-row input{letter-spacing:2px; font-weight:600}

  .center-msg{text-align:center; padding:70px 20px}
  .center-msg .em{font-size:44px; margin-bottom:14px}
  .center-msg h2{margin-bottom:8px}

  /* ---- decks manager ---- */
  table{width:100%; border-collapse:collapse; font-size:13px}
  th{text-align:left; font-weight:500; color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:1px; padding:10px 12px; border-bottom:1px solid var(--border)}
  td{padding:12px; border-bottom:1px solid var(--border); vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .switch{position:relative; width:40px; height:22px; flex-shrink:0}
  .switch input{opacity:0; width:0; height:0}
  .slider{position:absolute; inset:0; background:var(--border); border-radius:99px; transition:.2s; cursor:pointer}
  .slider::before{content:""; position:absolute; height:16px; width:16px; left:3px; top:3px; background:var(--dim); border-radius:50%; transition:.2s}
  .switch input:checked + .slider{background:rgba(179,122,212,.3)}
  .switch input:checked + .slider::before{transform:translateX(18px); background:var(--accent)}
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px}

  /* checkboxes for quiz */
  .deck-check{display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; font-size:13px}
  .deck-check:hover{border-color:var(--dim)}
  .deck-check input{accent-color:var(--accent); width:16px; height:16px}
  .quiz-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; margin-bottom:20px}

  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:50; padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:24px; width:100%; max-width:520px; max-height:85vh; overflow:auto}
  .modal h2{margin-bottom:16px}
  label.field{display:block; margin-bottom:14px}
  label.field span{display:block; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin-bottom:6px}
  input[type=text], textarea, select{
    width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius); padding:10px 12px; font-family:var(--mono); font-size:13px;
  }
  textarea{resize:vertical; min-height:60px}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:8px}

  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:12px 20px; font-size:13px; z-index:80; transition:transform .3s; box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.ok{border-color:var(--success)} .toast.err{border-color:#dc4a4a}

  .celebrate{position:fixed; inset:0; pointer-events:none; z-index:70}

  @media(max-width:560px){
    .hero{flex-direction:column; align-items:flex-start}
    .hero-stats{gap:24px}
    nav{width:100%; order:3}
    .rate .nxt{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg class="logo" viewBox="0 0 120 120" width="30" height="30" aria-hidden="true">
      <polygon points="60,15 105,60 60,105 15,60" fill="#8695b3"/>
      <polygon points="67.8,15.7 104.3,67.8 52.2,104.3 15.7,52.2" fill="none" stroke="#4f8fd6" stroke-width="3"/>
      <path d="M44 94 L76 94 L66 66 L54 66 Z" fill="#0a0e3a"/>
      <path d="M60 40 L67 58 L53 58 Z" fill="#0a0e3a"/>
      <path d="M56 24 L64 24 L102 94 L18 94 Z M44 94 L76 94 L66 66 L54 66 Z M60 40 L67 58 L53 58 Z"
            fill="#cdd9ec" stroke="#070b2c" stroke-width="5" stroke-linejoin="round" fill-rule="evenodd"/>
      <path d="M60 44 C63 48 63 52 60 55 C57 52 57 48 60 44 Z" fill="#cdd9ec"/>
    </svg>
    Anchor
  </div>
  <nav id="nav">
    <button data-view="dashboard" class="active">Dashboard</button>
    <button data-view="study">Study</button>
    <button data-view="quiz">Mixed Quiz</button>
    <button data-view="stats">Stats</button>
    <button data-view="decks">Decks</button>
  </nav>
  <div class="streak-pill" title="Daily streak">🔥 <span id="streakNum">0</span></div>
</header>

<main>
  <!-- ================= DASHBOARD ================= -->
  <section id="dashboard" class="view active">
    <div class="hero">
      <div>
        <div class="section-title" style="margin-bottom:6px">Due today</div>
        <div class="big-num" id="dueCount">0</div>
        <div class="hero-stats">
          <div><div class="n" id="statStreak">0</div><div class="l">Day streak</div></div>
          <div><div class="n" id="statMastered">0</div><div class="l">Mastered</div></div>
          <div><div class="n" id="statTotal">0</div><div class="l">Active cards</div></div>
        </div>
      </div>
      <div class="hero-actions">
        <button class="btn primary big" id="startStudy">Start studying →</button>
        <button class="btn big" id="recapBtn">↻ Recap studied cards</button>
      </div>
    </div>

    <div style="margin-top:var(--gap)">
      <div class="section-title">Your decks</div>
      <div class="deck-grid" id="dashDecks"></div>
    </div>
  </section>

  <!-- ================= STATS ================= -->
  <section id="stats" class="view">
    <div id="statsInner"></div>
  </section>

  <!-- ================= STUDY ================= -->
  <section id="study" class="view">
    <div class="study-wrap" id="studyInner"></div>
  </section>

  <!-- ================= MIXED QUIZ ================= -->
  <section id="quiz" class="view">
    <div class="study-wrap" id="quizInner"></div>
  </section>

  <!-- ================= DECKS ================= -->
  <section id="decks" class="view">
    <div class="section-title">Deck manager</div>
    <div class="toolbar">
      <button class="btn" id="addCardBtn">+ Add card</button>
      <button class="btn" id="exportBtn">↓ Export JSON</button>
      <button class="btn" id="importBtn">↑ Import JSON</button>
      <button class="btn ghost" id="resetBtn" style="margin-left:auto">Reset progress</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
    <div class="panel" style="padding:0; overflow:hidden">
      <table>
        <thead><tr><th>On</th><th>Deck</th><th>New</th><th>Learning</th><th>Mastered</th><th></th></tr></thead>
        <tbody id="deckTable"></tbody>
      </table>
    </div>
  </section>
</main>

<!-- add card modal -->
<div class="overlay" id="cardModal">
  <div class="modal">
    <h2>Add a card</h2>
    <label class="field"><span>Deck</span><select id="fDeck"></select></label>
    <label class="field"><span>Front (question / term)</span><textarea id="fFront"></textarea></label>
    <label class="field"><span>Back (answer)</span><textarea id="fBack"></textarea></label>
    <label class="field"><span>Why it matters (one line)</span><input type="text" id="fWhy"></label>
    <label class="field"><span>Hint (optional)</span><input type="text" id="fHint"></label>

<script>
/* ============================================================
   ANCHOR — GRC spaced repetition. Vanilla JS, localStorage only.

/* ---------- seed deck content (paraphrased, no standard text) ---------- */
const SEED_DECKS = [
  { id:"gov", name:"Governance & GRC mindset", group:"Foundations", defaultOn:true, cards:[
    {front:"What are the 'three lines of defense'?", back:"1st = operational management who own & manage risk; 2nd = risk & compliance functions who oversee and set policy; 3rd = internal audit who give independent assurance.", why:"It separates who takes risk from who checks it, so assurance stays objective.", tags:["governance","assurance"]},
    {front:"What did the IIA's 2020 'Three Lines Model' change?", back:"It reframed the old 'lines of defense' around roles and collaboration rather than rigid defensive barriers, and added the governing body and external assurance to the picture.", why:"Risk management is about enabling objectives, not just blocking threats.", tags:["governance","three-lines"]},
    {front:"What does GRC integrate that siloed teams miss?", back:"Governance (direction & accountability), Risk (uncertainty to objectives) and Compliance (obligations) as one coordinated view instead of three disconnected ones.", why:"Integration removes duplicated controls and blind spots between teams.", tags:["governance"]},
    {front:"Governance vs management?", back:"Governance sets direction, defines objectives and oversees (the board's job). Management executes within that direction (the executives' job).", why:"Frameworks like COBIT deliberately separate 'evaluate/direct/monitor' from 'plan/build/run'.", tags:["governance"]},
    {front:"Preventive vs detective vs corrective controls?", back:"Preventive stops an event (access control); detective finds it after the fact (log review); corrective fixes/limits impact (backups, incident response).", why:"A healthy control set needs all three — prevention alone always fails eventually.", tags:["controls"]},
    {front:"What is a directive vs a deterrent control?", back:"Directive guides behaviour toward compliance (a policy, sign, or procedure); deterrent discourages a bad actor (warning banners, visible cameras).", why:"Control types map to how a control actually reduces risk, which auditors probe.", tags:["controls"]},
    {front:"What is a compensating control?", back:"An alternative control used when the primary/required one isn't feasible, giving comparable risk reduction.", why:"It keeps you compliant when a standard control can't be implemented.", tags:["controls"]},
    {front:"Order: policy, standard, procedure, guideline?", back:"Policy (intent/why) → Standard (mandatory rules/what) → Procedure (step-by-step how) → Guideline (recommended, non-mandatory).", why:"Auditors trace a control back up this chain to a governing policy.", tags:["governance","policy"]},
    {front:"What does a control 'map to'?", back:"A business or security objective (and often a risk it treats). Controls exist to give reasonable assurance an objective is met.", why:"A control with no objective is cost without purpose.", tags:["controls"]},
    {front:"Control objective vs control?", back:"The objective is the outcome you want ('only authorised users access data'); the control is the mechanism that achieves it (role-based access).", why:"Multiple controls can serve one objective; you test controls against objectives.", tags:["controls"]},
    {front:"Accountability vs responsibility?", back:"Responsibility = who does the work (can be many); accountability = the single person answerable for the outcome (cannot be delegated away).", why:"RACI charts hinge on there being exactly one 'A' per activity.", tags:["governance","raci"]},
    {front:"What does RACI stand for?", back:"Responsible, Accountable, Consulted, Informed — a matrix assigning roles to each task or decision.", why:"It removes 'I thought you were handling it' gaps in control ownership.", tags:["governance","raci"]},
    {front:"Risk owner vs control owner?", back:"Risk owner is accountable for managing a specific risk to an acceptable level; control owner is responsible for a specific control operating as designed.", why:"One risk may rely on several controls owned by different people.", tags:["governance","risk"]},
    {front:"What is 'tone at the top'?", back:"The ethical climate and commitment to controls set by senior leadership, which shapes the whole organisation's behaviour.", why:"Controls fail fast when leadership visibly doesn't care about them.", tags:["governance","culture"]},
    {front:"Due care vs due diligence?", back:"Due care = doing what a reasonable party would do to protect assets (acting responsibly). Due diligence = the ongoing investigation and homework that informs that care.", why:"Regulators and courts judge organisations on both.", tags:["governance"]},
    {front:"Internal vs external audit?", back:"Internal audit is an in-house, independent-of-operations function giving assurance to the board; external audit is an outside party giving assurance to third parties (regulators, customers).", why:"Independence is what makes either audit's opinion worth anything.", tags:["governance","audit"]},
    {front:"What is a control self-assessment (CSA)?", back:"A process where the people who operate controls assess their own control effectiveness, usually facilitated and reviewed by risk/compliance.", why:"It scales assurance and builds ownership, but isn't a substitute for independent testing.", tags:["governance","assurance"]},
    {front:"What is the COSO Internal Control framework?", back:"A widely used model of internal control with five components: control environment, risk assessment, control activities, information & communication, and monitoring.", why:"It's the backbone many SOX/financial-control programs are built on.", tags:["governance","coso"]},
    {front:"What is a maturity model (e.g. CMMI levels)?", back:"A scale rating how repeatable and managed a process is — typically Initial, Managed, Defined, Quantitatively Managed, Optimizing.", why:"It turns 'are we good at this?' into a defensible, comparable rating.", tags:["governance","maturity"]},
    {front:"What is a management assertion?", back:"A formal claim by management (e.g. 'these controls operated effectively') that an auditor then tests and opines on.", why:"Attestation reports like SOC 2 are built around testing management's assertions.", tags:["governance","audit"]},
    {front:"Corporate governance vs IT governance?", back:"Corporate governance directs the whole organisation for stakeholders; IT governance is the subset ensuring IT supports and aligns with those business objectives.", why:"IT decisions must ladder up to business value, not run as a silo.", tags:["governance"]},
    {front:"What is COBIT?", back:"A framework for the governance and management of enterprise IT; it separates governance objectives (Evaluate, Direct, Monitor) from management objectives (Plan, Build, Run, Monitor).", why:"It's the reference when governance of IT specifically is in scope.", tags:["governance","cobit"]},
    {front:"COSO Internal Control vs COSO ERM?", back:"Internal Control is the five-component model for reliable operations/reporting/compliance; ERM is the broader, enterprise-wide framework for managing risk to strategy and objectives.", why:"One is control-focused, the other strategy-and-risk-focused.", tags:["governance","coso"]},
    {front:"What is a policy exception (waiver)?", back:"A formal, time-bound, approved deviation from a policy, granted with compensating controls and a review date.", why:"It keeps deviations visible and governed instead of silent non-compliance.", tags:["governance","policy"]},
    {front:"Four ways to test a control?", back:"Inquiry (ask), Observation (watch), Inspection (examine evidence), Re-performance (redo it yourself) — increasing in reliability.", why:"Re-performance gives the strongest assurance; inquiry alone is weakest.", tags:["governance","assurance"]},
    {front:"What is an audit/risk committee?", back:"A board sub-committee the board delegates oversight of audit, controls and risk to, often with independent members.", why:"It's how the governing body exercises hands-on oversight.", tags:["governance","board"]},
    {front:"What does an ethics hotline / whistleblower channel provide?", back:"A confidential, often anonymous way to report misconduct or control failures without fear of retaliation.", why:"It surfaces issues management might otherwise never hear about.", tags:["governance","ethics"]},
  ]},

  { id:"risk", name:"Risk fundamentals", group:"Foundations", defaultOn:true, cards:[
    {front:"Threat vs vulnerability vs risk vs asset?", back:"Asset = something of value; Vulnerability = a weakness; Threat = something that could exploit it; Risk = the likelihood and impact of that happening.", why:"Risk only exists where a threat can meet a vulnerability affecting an asset.", tags:["risk","basics"]},
    {front:"Inherent vs residual risk?", back:"Inherent = risk before any controls. Residual = risk that remains after controls are applied.", why:"You accept residual risk, not inherent — the gap tells you if controls are enough.", tags:["risk"]},
    {front:"How is risk level typically calculated?", back:"Likelihood × Impact — the probability an event occurs times the severity if it does.", why:"It lets you rank very different risks on one comparable scale.", tags:["risk","assessment"]},
    {front:"Risk appetite vs tolerance vs capacity?", back:"Appetite = how much risk you *want* to take pursuing goals; tolerance = acceptable variation around that; capacity = the max you could absorb before real harm.", why:"Appetite guides strategy; exceeding capacity threatens survival.", tags:["risk"]},
    {front:"Name the four risk treatment options.", back:"Accept, Mitigate (reduce), Transfer (e.g. insurance/outsourcing), Avoid (stop the activity).", why:"Every risk decision is ultimately one of these four.", tags:["risk","treatment"]},
    {front:"Does transferring risk remove your accountability?", back:"No. You can transfer financial impact (insurance) or operations (outsourcing), but accountability for the outcome — especially for data — usually stays with you.", why:"'We outsourced it' is not a defense a regulator accepts.", tags:["risk","treatment"]},
    {front:"KRI vs KPI?", back:"KRI = Key Risk Indicator, an early-warning metric that risk is rising; KPI = Key Performance Indicator, a measure of performance/success.", why:"KRIs let you act before a risk becomes an incident.", tags:["risk","metrics"]},
    {front:"What is a risk register?", back:"A living record of identified risks with owner, likelihood, impact, treatment and status.", why:"It's the primary evidence that risks are actually being managed, not just noticed.", tags:["risk"]},
    {front:"Qualitative vs quantitative risk assessment?", back:"Qualitative uses ratings/scales (High/Med/Low); quantitative assigns numeric/monetary values (e.g. annualised loss).", why:"Quantitative supports cost-benefit decisions; qualitative is faster for triage.", tags:["risk","assessment"]},
    {front:"What are SLE, ARO and ALE?", back:"SLE = Single Loss Expectancy (loss per event); ARO = Annualized Rate of Occurrence (events per year); ALE = SLE × ARO (expected annual loss).", why:"ALE lets you compare a control's cost against the loss it prevents.", tags:["risk","quantitative"]},
    {front:"How is SLE calculated?", back:"SLE = Asset Value × Exposure Factor, where the exposure factor is the % of the asset lost in one event.", why:"It converts 'how bad' into a number you can annualise.", tags:["risk","quantitative"]},
    {front:"What is a risk matrix / heat map?", back:"A grid plotting likelihood against impact to visually rank and prioritise risks (often red/amber/green).", why:"It communicates a portfolio of risks to leadership at a glance.", tags:["risk","assessment"]},
    {front:"What is a secondary risk?", back:"A new risk introduced *by* your response to an original risk (e.g. outsourcing to cut cost creates vendor dependency).", why:"Treatments aren't free — each can create its own exposure.", tags:["risk","treatment"]},
    {front:"What is risk velocity?", back:"How quickly a risk would materialise and hit the organisation once it starts.", why:"A fast-moving risk needs faster detection/response than likelihood×impact alone shows.", tags:["risk","assessment"]},
    {front:"What is an opportunity (positive risk)?", back:"Uncertainty with a potential upside; ISO 31000 treats risk as any effect of uncertainty on objectives, good or bad.", why:"Good risk management also captures upside, not just avoids harm.", tags:["risk","iso31000"]},
    {front:"What is inherent limitation / control effectiveness?", back:"No control is perfect — you assess whether a control is designed well (design effectiveness) and actually operates as intended (operating effectiveness).", why:"A well-designed control that isn't run gives false comfort.", tags:["risk","controls"]},
    {front:"What is concentration risk?", back:"Over-reliance on a single vendor, system, customer or geography, so one failure has outsized impact.", why:"Diversification and avoiding single points of failure directly reduce it.", tags:["risk","resilience"]},
    {front:"What is third-party / supply-chain risk?", back:"Risk arising from vendors, suppliers and partners you depend on, including their security, resilience and compliance.", why:"Your risk surface extends to everyone with access to your data or operations.", tags:["risk","tprm"]},
    {front:"What is an emerging risk?", back:"A risk that is new or rapidly evolving with high uncertainty (e.g. generative AI misuse, novel regulation).", why:"They evade historical data, so they need forward-looking, qualitative handling.", tags:["risk"]},
    {front:"What is the risk management process in ISO 31000?", back:"Establish scope/context/criteria → assess (identify, analyse, evaluate) → treat → then monitor, review and communicate throughout.", why:"It's the generic backbone that domain standards like ISO 27005 specialise.", tags:["risk","iso31000"]},
    {front:"What is a risk treatment plan?", back:"The documented plan of which controls will address each risk, with owners, resources and timelines.", why:"It turns 'we should fix this' into an accountable, trackable commitment.", tags:["risk","treatment"]},
    {front:"Why monitor and review risks continuously?", back:"Risk is dynamic — likelihood, impact, controls and context all change, so a point-in-time assessment goes stale.", why:"An unmaintained risk register quickly becomes fiction.", tags:["risk"]},
    {front:"What is a risk appetite statement?", back:"A board-approved articulation of how much and what types of risk the organisation is willing to accept in pursuit of objectives, often broken down by category.", why:"It gives everyone a consistent yardstick for risk decisions.", tags:["risk","appetite"]},
    {front:"What is risk aggregation?", back:"Combining related or correlated individual risks to understand total exposure, which can be larger than any single risk suggests.", why:"Risks that look small alone can compound into a material one.", tags:["risk","aggregation"]},
    {front:"What are VaR and Monte Carlo in risk?", back:"Value at Risk estimates the maximum expected loss over a period at a confidence level; Monte Carlo simulation models many random outcomes to produce a loss distribution.", why:"They push quantitative risk beyond a single ALE number.", tags:["risk","quantitative"]},
    {front:"What is bow-tie analysis?", back:"A visual linking threats to a central 'top event' to consequences, with preventive barriers on the left and mitigating barriers on the right.", why:"It shows where controls sit and where you're thin at a glance.", tags:["risk","analysis"]},
    {front:"What is root cause analysis (e.g. 5 Whys)?", back:"Repeatedly asking 'why' to move past symptoms to the underlying cause so corrective action actually prevents recurrence.", why:"Fixing symptoms leaves the real risk in place.", tags:["risk","rca"]},
    {front:"What is risk culture?", back:"The shared attitudes, values and behaviours toward risk across an organisation — whether people actually surface, own and manage it.", why:"Strong frameworks fail in a weak risk culture.", tags:["risk","culture"]},
  ]},

  { id:"vocab", name:"Vocabulary & acronyms", group:"Foundations", defaultOn:true, cards:[
    {front:"What is the CIA triad?", back:"Confidentiality (only authorised access), Integrity (data is accurate/unaltered), Availability (accessible when needed) — the three core security goals.", why:"Almost every control exists to protect one of these three.", tags:["vocab","cia"]},
    {front:"RTO vs RPO?", back:"RTO = Recovery Time Objective, how fast you must restore. RPO = Recovery Point Objective, how much data loss (time) is acceptable.", why:"They drive backup frequency and DR investment.", tags:["vocab","bcdr"]},
    {front:"BIA (Business Impact Analysis)?", back:"An analysis that identifies critical processes and the impact of their disruption over time, feeding your RTO/RPO targets.", why:"You can't set recovery priorities without knowing what hurts most, fastest.", tags:["vocab","bcdr"]},
    {front:"BCP vs DRP?", back:"BCP (Business Continuity Plan) keeps the whole business running through disruption; DRP (Disaster Recovery Plan) is the IT-focused subset for restoring systems and data.", why:"DR restores the tech; BC keeps the business functioning meanwhile.", tags:["vocab","bcdr"]},
    {front:"SoD (Segregation of Duties)?", back:"Splitting a sensitive task across people so no one person can both act and conceal it (e.g. request vs approve payment).", why:"It's a core anti-fraud and error-prevention control.", tags:["vocab","controls"]},
    {front:"Least privilege?", back:"Give each user/process only the access strictly needed to do its job, nothing more.", why:"It shrinks the blast radius of any compromised account.", tags:["vocab","access"]},
    {front:"Need to know?", back:"Access is granted only to information required for a specific task, even if someone has the clearance level generally.", why:"Clearance alone isn't authorization — the task must justify the access.", tags:["vocab","access"]},
    {front:"What is AAA in access management?", back:"Authentication (who are you), Authorization (what may you do), Accounting/Auditing (what did you do).", why:"Every access decision and its trail rests on these three.", tags:["vocab","access"]},
    {front:"IAM vs MFA vs SSO?", back:"IAM = Identity & Access Management (the whole discipline); MFA = Multi-Factor Authentication (two+ factors); SSO = Single Sign-On (one login for many apps).", why:"They're layers of the same identity story, often confused.", tags:["vocab","access"]},
    {front:"PII vs sensitive/special-category data?", back:"PII = data identifying a person; sensitive/special-category data is a stricter subset (health, biometrics, race, religion, etc.) with extra protection.", why:"Special categories carry higher legal duties and breach consequences.", tags:["vocab","privacy"]},
    {front:"Data owner vs data custodian?", back:"Owner is accountable for classification and access decisions about the data; custodian implements and maintains the controls (often IT/ops).", why:"The business owns the data even when IT holds it.", tags:["vocab","data"]},
    {front:"What is data classification?", back:"Labelling data by sensitivity (e.g. Public, Internal, Confidential, Restricted) to drive how it's handled and protected.", why:"Controls should scale to the value of the data, not be one-size-fits-all.", tags:["vocab","data"]},
    {front:"DLP (Data Loss Prevention)?", back:"Technology and controls that detect and stop sensitive data from leaving the organisation improperly.", why:"It enforces classification at the boundary (email, USB, uploads).", tags:["vocab","controls"]},
    {front:"Encryption at rest vs in transit?", back:"At rest protects stored data (disks, databases, backups); in transit protects data moving over networks (TLS).", why:"You need both — a breach can target storage or the wire.", tags:["vocab","crypto"]},
    {front:"Encryption vs hashing?", back:"Encryption is reversible with a key (confidentiality); hashing is a one-way fingerprint used for integrity and password storage.", why:"You never 'decrypt' a hash — a common misconception.", tags:["vocab","crypto"]},
    {front:"What is non-repudiation?", back:"Assurance that someone cannot deny having performed an action, typically via digital signatures and strong logging.", why:"It's essential for accountability and legally meaningful audit trails.", tags:["vocab","crypto"]},
    {front:"SIEM?", back:"Security Information and Event Management — a system that aggregates and correlates logs/events to detect and investigate security incidents.", why:"It's the backbone of detective controls and monitoring.", tags:["vocab","secops"]},
    {front:"SOC — two very different meanings?", back:"A Security Operations Center (a team monitoring threats) vs a SOC report (a SOC 1/2/3 assurance report). Same acronym, unrelated.", why:"Context matters — mixing them up confuses audit and security conversations.", tags:["vocab"]},
    {front:"MTTD vs MTTR?", back:"Mean Time To Detect (how long to notice an incident) vs Mean Time To Respond/Recover (how long to contain/fix it).", why:"Lowering both directly reduces incident impact.", tags:["vocab","metrics"]},
    {front:"IOC (Indicator of Compromise)?", back:"Forensic evidence suggesting a breach — malicious IPs, file hashes, unusual traffic, etc.", why:"IOCs feed detection rules and threat hunting.", tags:["vocab","secops"]},
    {front:"GRC vs IRM?", back:"IRM (Integrated Risk Management) is Gartner's evolution of GRC — same goals, more risk-centric and technology-enabled framing.", why:"You'll see both terms for essentially the same discipline.", tags:["vocab"]},
    {front:"ERM (Enterprise Risk Management)?", back:"A firm-wide, top-down approach to identifying and managing risk across the whole organisation (frameworks: COSO ERM, ISO 31000).", why:"It aggregates risk so the board sees the portfolio, not just silos.", tags:["vocab","risk"]},
    {front:"TPRM / VRM?", back:"Third-Party Risk Management / Vendor Risk Management — assessing and monitoring the risk your suppliers introduce.", why:"Supply-chain incidents are a leading breach vector.", tags:["vocab","tprm"]},
    {front:"What is 'materiality'?", back:"A threshold of significance — whether an issue is large enough to affect decisions or require reporting.", why:"It focuses effort on what actually matters to stakeholders.", tags:["vocab","audit"]},
    {front:"Attestation?", back:"A formal statement/confirmation (often by management or an auditor) that something is true or a control operated.", why:"It's the paper trail auditors and customers rely on.", tags:["vocab","audit"]},
    {front:"SLA vs MOU vs NDA?", back:"SLA = Service Level Agreement (measurable service commitments); MOU = Memorandum of Understanding (non-binding intent); NDA = Non-Disclosure Agreement (confidentiality obligation).", why:"Each governs a different part of a third-party relationship.", tags:["vocab","contracts"]},
    {front:"Defense in depth?", back:"Layering multiple, independent controls so no single failure exposes the asset.", why:"Assume any one control can fail — depth catches what slips through.", tags:["vocab","controls"]},
    {front:"KYC and AML?", back:"Know Your Customer (verifying customer identity) and Anti-Money Laundering (detecting/preventing illicit funds) — core financial-sector compliance duties.", why:"They're heavily regulated obligations with criminal exposure.", tags:["vocab","compliance"]},
    {front:"EDR vs XDR?", back:"EDR = Endpoint Detection & Response (monitors endpoints); XDR = Extended Detection & Response (correlates across endpoint, network, cloud, identity).", why:"Detective controls have moved from single-signal to cross-domain.", tags:["vocab","secops"]},
    {front:"What is SOAR?", back:"Security Orchestration, Automation and Response — tooling that automates and coordinates incident-response workflows.", why:"It cuts response time by removing manual toil.", tags:["vocab","secops"]},
    {front:"What is PAM?", back:"Privileged Access Management — controlling, vaulting and monitoring high-privilege accounts (admins, service accounts).", why:"Privileged accounts are the crown jewels attackers hunt for.", tags:["vocab","access"]},
    {front:"RBAC vs ABAC?", back:"Role-Based Access Control grants access by role; Attribute-Based Access Control decides using attributes (user, resource, context) via policy.", why:"ABAC is more granular and dynamic; RBAC is simpler to administer.", tags:["vocab","access"]},
    {front:"Penetration test vs vulnerability scan?", back:"A vuln scan automatically identifies known weaknesses; a pen test has humans actively exploit them to prove real impact.", why:"A scan lists doors; a pen test walks through them.", tags:["vocab","testing"]},
    {front:"Red team vs blue team vs purple team?", back:"Red attacks (offense), Blue defends (detection/response), Purple is the collaboration that feeds red's findings back to improve blue.", why:"The goal isn't 'winning' — it's improving defenses.", tags:["vocab","testing"]},
    {front:"What is an insider threat?", back:"Risk from people with legitimate access — malicious insiders, or negligent ones who cause harm by mistake.", why:"Perimeter controls don't stop someone already inside.", tags:["vocab","threats"]},
    {front:"What is a SPOF?", back:"Single Point of Failure — one component whose failure takes down the whole system or process.", why:"Eliminating SPOFs is core to resilience and availability.", tags:["vocab","resilience"]},
  ]},

  { id:"iso27k", name:"ISO 27001 & 27002", group:"Standards", defaultOn:true, star:true, cards:[
    {front:"What is an ISMS?", back:"Information Security Management System — the framework of policies, processes and controls, driven by risk, that ISO 27001 requires an organisation to establish and continually improve.", why:"27001 certifies the *system*, not individual controls.", tags:["iso27001","isms"]},
    {front:"27001 vs 27002 — the difference?", back:"27001 is the certifiable *requirements* standard (the ISMS). 27002 is *guidance* giving implementation detail for the controls; you can't certify against 27002.", why:"Only 27001 gives you a certificate; 27002 helps you build the controls.", tags:["iso27001","iso27002"]},
    {front:"Which clauses of 27001 are auditable requirements?", back:"Clauses 4–10: Context, Leadership, Planning, Support, Operation, Performance evaluation, Improvement. (Clauses 0–3 are introductory.)", why:"An auditor checks conformity against 4–10, plus Annex A.", tags:["iso27001","clauses"]},
    {front:"What does clause 4 (Context) require?", back:"Determine internal/external issues, interested parties and their requirements, and define the ISMS scope.", why:"Scope errors here undermine the entire certification.", tags:["iso27001","context"]},
    {front:"What does clause 5 (Leadership) require?", back:"Top management commitment, an information security policy, and assigned roles/responsibilities/authorities.", why:"27001 makes security a leadership obligation, not just IT's.", tags:["iso27001","leadership"]},
    {front:"What is the Statement of Applicability (SoA)?", back:"A document listing every Annex A control, whether it's applied, the justification for inclusion/exclusion, and its implementation status.", why:"It's the central audit artefact linking your risks to chosen controls.", tags:["iso27001","soa"]},
    {front:"What is the risk treatment plan in 27001?", back:"The plan (clause 6.1.3) documenting how each identified risk will be handled, which controls address it, owners and timelines.", why:"It shows the ISMS is genuinely risk-driven.", tags:["iso27001","risk"]},
    {front:"How does 27001's risk assessment work (clause 6.1.2)?", back:"Define a repeatable risk process, identify risks to confidentiality/integrity/availability, assign owners, and analyse/evaluate against defined criteria.", why:"Repeatability is what lets results be compared over time and audited.", tags:["iso27001","risk"]},
    {front:"Annex A control themes in the 2022 revision?", back:"Four themes: Organizational, People, Physical, and Technological controls.", why:"The 2022 rework replaced the older 14-domain structure.", tags:["iso27001","annexa","2022"]},
    {front:"How many controls are in Annex A (2022)?", back:"93 controls (down from 114 in 2013), reorganised into the four themes, with 11 brand-new controls.", why:"Knowing the count and structure is common Lead Implementer exam fodder.", tags:["iso27001","annexa","2022"]},
    {front:"Name a few new Annex A controls in 2022.", back:"Examples: Threat intelligence, Information security for cloud services, ICT readiness for business continuity, Data leakage prevention, Web filtering, Secure coding, Configuration management, Data masking.", why:"They modernise the standard for cloud and modern threats.", tags:["iso27001","annexa","2022"]},
    {front:"What are the five control 'attributes' introduced in 27002:2022?", back:"Control type, Information security properties (CIA), Cybersecurity concepts, Operational capabilities, and Security domains — hashtag-style tags to filter/group controls.", why:"They let you map controls to other frameworks (e.g. NIST CSF functions).", tags:["iso27002","2022"]},
    {front:"What documented information is mandatory in 27001?", back:"Scope, IS policy, risk assessment & treatment process, SoA, risk treatment plan, objectives, plus records like competence, monitoring results, internal audit and management review.", why:"'If it isn't documented, it didn't happen' to an ISO auditor.", tags:["iso27001","documentation"]},
    {front:"What does clause 9.2 (internal audit) require?", back:"Planned, periodic internal audits of the ISMS by objective auditors to confirm it conforms to 27001 and is effectively implemented.", why:"It's the organisation checking itself before the certification body does.", tags:["iso27001","audit"]},
    {front:"What is the management review (clause 9.3)?", back:"Top management periodically reviews the ISMS — audit results, KPIs, risk status, incidents — and decides on changes and improvements.", why:"It keeps leadership actively steering the ISMS.", tags:["iso27001","review"]},
    {front:"How does clause 10 handle a nonconformity?", back:"React and correct it, evaluate the root cause, take corrective action to stop recurrence, and drive continual improvement.", why:"It's root-cause fixing, not just patching the symptom.", tags:["iso27001","improvement"]},
    {front:"What does PDCA mean and where does it apply?", back:"Plan-Do-Check-Act — the continual-improvement cycle underpinning the ISMS lifecycle.", why:"27001 demands ongoing improvement, not a one-off setup.", tags:["iso27001","pdca"]},
    {front:"What is the ISO 27001 certification cycle?", back:"Stage 1 (documentation review) → Stage 2 (implementation audit) → certificate → annual surveillance audits → full recertification every ~3 years.", why:"Certification is a continuing commitment, not a one-time badge.", tags:["iso27001","certification"]},
    {front:"How does ISO 31000 relate to 27001?", back:"31000 is the generic risk-management *guidance* standard; 27001's risk process aligns with it but is specific to information security.", why:"31000 gives the risk vocabulary 27001 builds on.", tags:["iso27001","iso31000"]},
    {front:"What is ISO 27005?", back:"Guidance specifically for information security risk management — how to identify, analyse and treat infosec risk within an ISMS.", why:"It fleshes out the risk clauses 27001 states but doesn't detail.", tags:["iso27001","iso27005"]},
    {front:"What do ISO 27017 and 27018 add?", back:"27017 = security controls guidance for cloud services; 27018 = protection of PII in public clouds.", why:"They extend the 27000 family for cloud-specific concerns.", tags:["iso27001","cloud"]},
    {front:"Certification scope — why does it matter so much?", back:"The scope defines which parts of the organisation the ISMS (and certificate) cover; a narrow scope can be technically valid but misleading to customers.", why:"Always check what a supplier's certificate actually covers.", tags:["iso27001","scope"]},
    {front:"Can you exclude an Annex A control?", back:"Yes — Annex A is a reference set. You can exclude controls in the SoA if you justify why they don't apply to your risks.", why:"The SoA justification is exactly what auditors scrutinise.", tags:["iso27001","soa"]},
    {front:"What changed moving from 27001:2013 to 27001:2022?", back:"Mainly Annex A: restructured from 14 domains/114 controls to 4 themes/93 controls with new controls and attributes; the management clauses saw minor alignment updates.", why:"Certified organisations had a transition window to migrate.", tags:["iso27001","2022"]},
    {front:"What is the ISO 27000 family?", back:"A suite: 27000 (overview & vocabulary), 27001 (ISMS requirements), 27002 (control guidance), 27005 (risk), 27017/27018 (cloud/PII), 27004 (measurement), among others.", why:"Knowing which number does what is basic Lead Implementer literacy.", tags:["iso27001","family"]},
    {front:"Roughly how are the 93 Annex A controls split across the four themes?", back:"Organizational 37, People 8, Physical 14, Technological 34.", why:"The theme sizes hint at where most controls actually live.", tags:["iso27001","annexa","2022"]},
    {front:"Give examples of Organizational controls (Annex A).", back:"Policies for information security, segregation of duties, threat intelligence, supplier/cloud security, information classification, incident management, and legal/regulatory compliance.", why:"Organizational is the largest theme and the governance backbone.", tags:["iso27001","annexa","organizational"]},
    {front:"Give examples of People controls (Annex A).", back:"Screening before employment, terms & conditions, security awareness/training, disciplinary process, remote working, and responsibilities after termination.", why:"People are both the biggest risk and a key control layer.", tags:["iso27001","annexa","people"]},
    {front:"Give examples of Physical controls (Annex A).", back:"Physical security perimeters and secure areas, equipment siting and protection, secure disposal/reuse, and clear desk / clear screen.", why:"Physical access can bypass every technical control.", tags:["iso27001","annexa","physical"]},
    {front:"Give examples of Technological controls (Annex A).", back:"Access control, cryptography and key management, secure development, change management, backup, logging & monitoring, network security, malware protection, and technical vulnerability management.", why:"This is where most day-to-day security engineering sits.", tags:["iso27001","annexa","technological"]},
    {front:"What does the cryptography control require you to have?", back:"A policy on the use of cryptography and proper key management across the key lifecycle (generation, storage, rotation, destruction).", why:"Weak key management undermines otherwise strong encryption.", tags:["iso27001","crypto"]},
    {front:"What does the logging & monitoring control aim at?", back:"Recording security-relevant events and monitoring them to detect anomalies and support investigation.", why:"Without reliable logs, incidents are invisible and un-investigable.", tags:["iso27001","logging"]},
    {front:"What does the supplier-relationships control address?", back:"Managing information security risks from suppliers and the ICT supply chain via agreements, requirements and monitoring.", why:"Your ISMS scope extends to third parties handling your information.", tags:["iso27001","supplier"]},
    {front:"What is ISO 27004?", back:"Guidance on monitoring, measurement, analysis and evaluation of ISMS performance — i.e. how to build meaningful security metrics.", why:"Clause 9.1 demands measurement; 27004 tells you how.", tags:["iso27001","iso27004","metrics"]},
    {front:"At a high level, what are the phases of an ISMS implementation project?", back:"Get management support & scope → understand context and requirements → risk assessment → select controls & write the SoA → implement controls → train & operate → internal audit & management review → certification.", why:"This end-to-end flow is the heart of the Lead Implementer role.", tags:["iso27001","implementation"]},
    {front:"Major vs minor nonconformity vs observation (audit findings)?", back:"Major = a significant failure that undermines the ISMS (blocks certification); minor = an isolated lapse; observation/opportunity = not a nonconformity but worth improving.", why:"A major finding must be fixed before a certificate is granted.", tags:["iso27001","audit"]},
    {front:"Who accepts residual risk in an ISMS, and how?", back:"The identified risk owner formally accepts residual risk against defined criteria, typically documented in the risk treatment plan/register.", why:"27001 requires risk owners' approval of treatment and acceptance.", tags:["iso27001","risk"]},
    {front:"What is 'documented information' control in 27001?", back:"Requirements for creating, approving, versioning, distributing and protecting the ISMS's documents and records.", why:"Auditors check that the right version is controlled and available.", tags:["iso27001","documentation"]},
    {front:"Corrective action vs continual improvement (clause 10)?", back:"Corrective action reacts to a specific nonconformity and stops it recurring; continual improvement is the ongoing effort to make the ISMS more effective overall.", why:"One is reactive and targeted, the other proactive and broad.", tags:["iso27001","improvement"]},
    {front:"What does clause 7 (Support) cover?", back:"Resources, competence, awareness, communication, and control of documented information needed for the ISMS.", why:"An ISMS with no resourced, competent people is just paperwork.", tags:["iso27001","support"]},
    {front:"What are information security objectives (clause 6.2)?", back:"Measurable security goals, consistent with the policy, with plans stating what will be done, by whom, when, and how results are evaluated.", why:"They make the ISMS's intent concrete and trackable.", tags:["iso27001","objectives"]},
    {front:"What does the change-management control protect against?", back:"Uncontrolled changes to systems and processes introducing security weaknesses; changes should be assessed, approved and tested.", why:"A huge share of incidents trace back to unmanaged change.", tags:["iso27001","change"]},
  ]},

  { id:"nist", name:"NIST", group:"Standards", defaultOn:false, cards:[
    {front:"The six functions of NIST CSF 2.0?", back:"Govern, Identify, Protect, Detect, Respond, Recover.", why:"'Govern' is the 2.0 addition, elevating oversight/strategy to a top-level function.", tags:["nist","csf","2.0"]},
    {front:"What did CSF 2.0 add vs 1.1?", back:"A new 'Govern' function (risk strategy, roles, policy, supply chain) wrapping the other five, plus broader scope beyond critical infrastructure.", why:"It signals governance is now central, not assumed.", tags:["nist","csf"]},
    {front:"What are the CSF Core's building blocks?", back:"Functions → Categories → Subcategories (outcomes), with Informative References mapping to other standards.", why:"The core is a catalogue of outcomes, not prescriptive steps.", tags:["nist","csf"]},
    {front:"CSF Implementation Tiers?", back:"Tiers 1–4: Partial, Risk Informed, Repeatable, Adaptive — describing how rigorous and integrated your risk practices are.", why:"Tiers gauge maturity, not a pass/fail score.", tags:["nist","csf","tiers"]},
    {front:"CSF Current vs Target Profile?", back:"A Profile is your selected outcomes; comparing Current to Target reveals gaps and priorities.", why:"Profiles turn the framework into a roadmap.", tags:["nist","csf","profile"]},
    {front:"NIST 800-53 vs 800-171?", back:"800-53 = full control catalog for federal systems. 800-171 = a subset protecting Controlled Unclassified Information (CUI) in non-federal systems.", why:"Contractors handling CUI are typically held to 800-171.", tags:["nist","800-53","800-171"]},
    {front:"What is CUI?", back:"Controlled Unclassified Information — government data that's sensitive but not classified, requiring safeguarding (the focus of 800-171).", why:"Mishandling CUI can cost contractors their eligibility.", tags:["nist","cui"]},
    {front:"How are 800-53 controls organised?", back:"Into control families (e.g. Access Control, Audit & Accountability, Incident Response), each with numbered controls and enhancements.", why:"Families let you assign and assess controls by domain.", tags:["nist","800-53"]},
    {front:"What are 800-53B baselines?", back:"Pre-selected control sets for Low, Moderate and High impact systems, so you start from a tailored baseline rather than the full catalog.", why:"Impact level drives how many controls you must implement.", tags:["nist","800-53","baseline"]},
    {front:"The NIST RMF steps?", back:"Prepare, Categorize, Select, Implement, Assess, Authorize, Monitor.", why:"It's the process for authorizing a system to operate and keeping it authorized.", tags:["nist","rmf"]},
    {front:"What is an ATO (Authorization to Operate)?", back:"A senior official's formal risk-acceptance decision permitting a system to run in production, issued after the RMF 'Authorize' step.", why:"It makes someone accountable for accepting the system's residual risk.", tags:["nist","rmf","ato"]},
    {front:"What does FIPS 199 do?", back:"Categorises information systems by potential impact (Low/Moderate/High) on confidentiality, integrity and availability.", why:"This categorisation feeds the RMF 'Categorize' step and control baseline.", tags:["nist","fips-199"]},
    {front:"What is NIST SP 800-30?", back:"Guidance for conducting risk assessments — identifying threats, vulnerabilities, likelihood and impact for information systems.", why:"It's the how-to behind the RMF's risk steps.", tags:["nist","800-30","risk"]},
    {front:"What is NIST SP 800-61?", back:"The Computer Security Incident Handling Guide — the classic incident-response lifecycle: Preparation, Detection & Analysis, Containment/Eradication/Recovery, Post-Incident Activity.", why:"Most IR playbooks trace back to this structure.", tags:["nist","800-61","incident"]},
    {front:"SP vs FIPS documents?", back:"Special Publications (800-series) are guidance/recommendations; FIPS are mandatory federal standards.", why:"FIPS you must follow; SPs you follow as best practice (unless contractually required).", tags:["nist","docs"]},
    {front:"What is continuous monitoring in the RMF?", back:"The ongoing 'Monitor' step — tracking control effectiveness, changes and new risks so authorization stays valid over time.", why:"Security posture drifts; monitoring keeps the ATO honest.", tags:["nist","rmf","monitoring"]},
    {front:"NIST CSF vs ISO 27001 — how do they relate?", back:"CSF is a voluntary, outcome-based framework you self-assess against; 27001 is a certifiable management-system standard. They map to each other and are often used together.", why:"Many orgs use CSF to organise and 27001 to certify.", tags:["nist","iso27001","compare"]},
    {front:"Is NIST CSF mandatory?", back:"It's voluntary guidance (though effectively required for many US federal agencies and their contractors, and widely adopted commercially).", why:"Adoption is often driven by contracts and customer expectations, not law.", tags:["nist","csf"]},
    {front:"What are the categories of the CSF 2.0 Govern function?", back:"Organizational Context; Risk Management Strategy; Roles, Responsibilities & Authorities; Policy; Oversight; and Cybersecurity Supply Chain Risk Management.", why:"Govern is where strategy, accountability and supply-chain risk now live.", tags:["nist","csf","govern"]},
    {front:"What does the Identify function cover?", back:"Understanding the organisation's assets, suppliers, and risks — asset management, risk assessment, and improvement.", why:"You can't protect what you haven't identified.", tags:["nist","csf","identify"]},
    {front:"What does the Protect function cover?", back:"Safeguards: identity management & access control, awareness & training, data security, platform security, and technology infrastructure resilience.", why:"It's the bulk of preventive controls.", tags:["nist","csf","protect"]},
    {front:"What do the Detect, Respond and Recover functions cover?", back:"Detect = continuous monitoring and adverse-event analysis; Respond = incident management, analysis, mitigation and reporting; Recover = restoring capabilities and communicating during recovery.", why:"Together they handle what prevention doesn't stop.", tags:["nist","csf","detect-respond-recover"]},
    {front:"CSF outcomes vs 800-53 — how do they fit?", back:"CSF states desired outcomes (Subcategories); NIST 800-53 provides the detailed control catalog you implement to achieve them, mapped via Informative References.", why:"CSF is the 'what/why', 800-53 is the 'how'.", tags:["nist","csf","800-53"]},
    {front:"What is the NIST Privacy Framework?", back:"A companion to the CSF for managing privacy risk, with functions Identify-P, Govern-P, Control-P, Communicate-P and Protect-P.", why:"Security and privacy risk overlap but aren't the same.", tags:["nist","privacy-framework"]},
    {front:"What is the NIST SSDF (SP 800-218)?", back:"The Secure Software Development Framework — practices for building security into the software development lifecycle.", why:"It's central to software supply-chain security expectations.", tags:["nist","ssdf","800-218"]},
    {front:"What does NIST SP 800-63 define?", back:"Digital identity guidelines with three assurance levels: IAL (identity proofing), AAL (authentication strength), FAL (federation).", why:"It sets how strongly you must prove and authenticate identity.", tags:["nist","800-63","identity"]},
    {front:"What changed in 800-53 Revision 5?", back:"It integrated privacy controls with security, added a Supply Chain Risk Management (SR) family, and made controls outcome-based (less tied to who implements them).", why:"Rev 5 reflects privacy and supply chain becoming first-class concerns.", tags:["nist","800-53","rev5"]},
    {front:"What is a CSF Organizational Profile used for?", back:"Documenting the org's Current and Target state across the CSF outcomes to prioritise and track improvement.", why:"It converts the framework into an actionable roadmap.", tags:["nist","csf","profile"]},
    {front:"What are Informative References in the CSF?", back:"Mappings from CSF outcomes to specific controls in other standards (ISO 27001, 800-53, etc.).", why:"They let you reuse existing control work instead of starting over.", tags:["nist","csf","mappings"]},
    {front:"Is the CSF prescriptive about how to achieve outcomes?", back:"No — it's technology- and vendor-neutral, describing outcomes and leaving the 'how' to each organisation.", why:"That flexibility is why it maps onto so many environments.", tags:["nist","csf"]},
  ]},

  { id:"aigov", name:"AI Governance", group:"Standards", defaultOn:false, star:true, cards:[
    {front:"What is ISO/IEC 42001?", back:"The AI Management System (AIMS) standard — a certifiable framework (like 27001 but for AI) to govern responsible development and use of AI.", why:"It's the go-to standard for demonstrating structured AI governance.", tags:["42001","aims"]},
    {front:"What is an AIMS?", back:"An AI Management System — the organisational policies, roles, processes and controls for governing AI responsibly across its lifecycle, defined by ISO 42001.", why:"It operationalises 'responsible AI' into an auditable system.", tags:["42001","aims"]},
    {front:"Does ISO 42001 share structure with ISO 27001?", back:"Yes — both use the common ISO management-system structure (Annex SL, clauses 4–10), so context, leadership, planning, support, operation, evaluation and improvement all recur.", why:"An org with 27001 can integrate 42001 without starting from scratch.", tags:["42001","annex-sl"]},
    {front:"CONTRAST — ISO 42001 vs EU AI Act: which is voluntary and which is law?", back:"ISO 42001 = a *voluntary, certifiable management-system standard* you choose to adopt. EU AI Act = *binding regulation* you must comply with if in scope, with risk tiers and penalties.", why:"Conflating a standard you adopt with a law you must obey is the classic AIGP trap.", tags:["42001-vs-aiact","aigp"]},
    {front:"CONTRAST — what obligation type does 42001 create vs the EU AI Act?", back:"42001 creates *organisational* obligations (run and improve an AIMS). The EU AI Act creates *product/system* legal obligations tied to risk tier (conformity assessment, transparency, human oversight).", why:"One governs your management system; the other governs specific AI systems by law.", tags:["42001-vs-aiact","aigp"]},
    {front:"CONTRAST — how do you 'prove' 42001 vs the EU AI Act?", back:"42001: certification by an accredited body (audit of your AIMS). EU AI Act: legal conformity — for high-risk systems, a conformity assessment, CE marking and registration.", why:"A 42001 certificate is not by itself proof of AI Act compliance.", tags:["42001-vs-aiact","aigp"]},
    {front:"The EU AI Act risk tiers?", back:"Unacceptable (banned), High-risk (strict obligations), Limited (transparency duties), Minimal (largely unregulated).", why:"An AI system's tier determines the entire compliance burden.", tags:["euaiact","risk-tiers"]},
    {front:"Give examples of 'unacceptable risk' (banned) AI under the Act.", back:"Social scoring by public authorities, manipulative/subliminal techniques causing harm, untargeted scraping of faces for recognition databases, and certain real-time biometric ID in public (with narrow exceptions).", why:"These are prohibited outright, regardless of safeguards.", tags:["euaiact","prohibited"]},
    {front:"What counts as 'high-risk' AI under the Act?", back:"AI used in areas like critical infrastructure, education, employment, essential services, law enforcement, migration, and as safety components of regulated products.", why:"High-risk triggers the heaviest obligations (risk mgmt, data governance, oversight, docs).", tags:["euaiact","high-risk"]},
    {front:"What are the transparency (limited-risk) obligations?", back:"Users must be told when they're interacting with AI (e.g. chatbots) and AI-generated or manipulated content (deepfakes) must be disclosed/labelled.", why:"The duty is honesty about AI, not a full conformity assessment.", tags:["euaiact","transparency"]},
    {front:"Provider vs deployer under the EU AI Act?", back:"Provider = develops/places the AI system on the market; Deployer = uses it under their own authority. Obligations differ by role.", why:"You must know your role to know which duties apply.", tags:["euaiact","roles"]},
    {front:"What is GPAI under the EU AI Act?", back:"General-Purpose AI models (e.g. large foundation models) — they carry their own transparency and documentation duties, with extra obligations for models posing 'systemic risk'.", why:"Foundation-model providers are regulated distinctly from downstream apps.", tags:["euaiact","gpai"]},
    {front:"What are the EU AI Act penalty ceilings?", back:"Up to €35M or 7% of global annual turnover for prohibited-AI breaches; lower tiers (up to €15M/3% and €7.5M/1.5%) for other violations and incorrect information.", why:"Fines scale like GDPR — non-compliance is materially expensive.", tags:["euaiact","penalties"]},
    {front:"Roughly how is the EU AI Act being phased in?", back:"It entered into force in 2024, with prohibitions applying first (early 2025), GPAI obligations next, and most high-risk obligations phasing in through 2026–2027.", why:"Different duties bite at different times — timing matters for planning.", tags:["euaiact","timeline"]},
    {front:"What is a conformity assessment (high-risk AI)?", back:"The formal process of demonstrating a high-risk AI system meets the Act's requirements before it's placed on the market (self-assessment or via a notified body).", why:"It's the legal gate high-risk systems must pass.", tags:["euaiact","conformity"]},
    {front:"The four functions of the NIST AI RMF?", back:"Govern, Map, Measure, Manage — Govern is cross-cutting; the others cycle through context, assessment and treatment of AI risks.", why:"It's the leading voluntary framework for trustworthy AI risk.", tags:["nist-ai-rmf","aigp"]},
    {front:"What does NIST call the characteristics of 'trustworthy AI'?", back:"Valid & reliable, safe, secure & resilient, accountable & transparent, explainable & interpretable, privacy-enhanced, and fair with harmful bias managed.", why:"These are the outcomes the AI RMF tries to achieve.", tags:["nist-ai-rmf","trustworthy"]},
    {front:"CONTRAST — NIST AI RMF vs EU AI Act?", back:"AI RMF is voluntary US guidance for managing AI risk; the EU AI Act is binding EU law with mandatory tiers and penalties. RMF can *help* meet the Act but doesn't equal compliance.", why:"Frameworks inform compliance; only the law defines it.", tags:["nist-ai-rmf","euaiact","aigp"]},
    {front:"What is an AI impact assessment?", back:"A structured evaluation of an AI system's potential effects on people's rights, safety and outcomes, done before/while deploying.", why:"It surfaces harms (bias, safety) early, when they're cheap to fix.", tags:["ai-governance","assessment"]},
    {front:"What is algorithmic bias?", back:"Systematic unfairness in an AI system's outputs against certain groups, often from biased training data or design choices.", why:"Managing harmful bias is a core trustworthy-AI and legal requirement.", tags:["ai-governance","bias"]},
    {front:"What is a model card?", back:"A short document describing an AI model's intended use, performance, limitations and ethical considerations.", why:"It's a practical transparency artefact supporting responsible use.", tags:["ai-governance","transparency"]},
    {front:"What is ISO/IEC 23894?", back:"Guidance on AI risk management — how to apply risk-management principles (aligned with ISO 31000) specifically to AI.", why:"It complements 42001 the way 27005 complements 27001.", tags:["ai-governance","iso23894"]},
    {front:"What are the OECD AI Principles?", back:"An influential set of values-based principles for trustworthy AI (inclusive growth, human-centred values, transparency, robustness, accountability) adopted by many governments.", why:"They shaped much of today's AI regulation and the term 'trustworthy AI'.", tags:["ai-governance","oecd"]},
    {front:"What are the main obligations for HIGH-RISK AI under the EU AI Act?", back:"A risk-management system, data governance, technical documentation, record-keeping/logging, transparency to deployers, human oversight, and accuracy/robustness/cybersecurity.", why:"These Article 8-15 duties are the core of high-risk compliance.", tags:["euaiact","high-risk"]},
    {front:"What are the three forms of human oversight for AI?", back:"Human-in-the-loop (a human approves each action), human-on-the-loop (a human monitors and can intervene), and human-in-command (overall human authority to override or shut down).", why:"The EU AI Act requires meaningful human oversight for high-risk AI.", tags:["ai-governance","human-oversight"]},
    {front:"Explainability vs interpretability?", back:"Interpretability = the model is inherently understandable (e.g. a decision tree); explainability = post-hoc techniques that explain a complex model's outputs.", why:"Both support transparency but via different means.", tags:["ai-governance","explainability"]},
    {front:"What triggers 'systemic risk' GPAI obligations in the EU AI Act?", back:"A general-purpose model presumed to have high-impact capabilities — indicatively when training compute exceeds 10^25 FLOPs — gets extra evaluation, risk-mitigation and reporting duties.", why:"The largest foundation models carry heavier obligations.", tags:["euaiact","gpai"]},
    {front:"Who enforces the EU AI Act?", back:"The EU AI Office (within the Commission) oversees GPAI and coordination; national market-surveillance/competent authorities enforce in each member state.", why:"Enforcement is split between EU-level and national bodies.", tags:["euaiact","enforcement"]},
    {front:"What does the EU AI Act require of training data (data governance)?", back:"For high-risk AI, training/validation/test data must be relevant, sufficiently representative, and as far as possible free of errors and complete, with attention to bias.", why:"Poor data is the root of most AI harms the Act targets.", tags:["euaiact","data-governance"]},
    {front:"What is a conformity assessment done by — self vs notified body?", back:"Most high-risk AI uses internal self-assessment against the requirements; certain systems (e.g. some biometrics) need a third-party notified body.", why:"The route depends on the system's type and risk.", tags:["euaiact","conformity"]},
    {front:"After a high-risk AI passes conformity assessment, what's needed to market it in the EU?", back:"A CE marking, a declaration of conformity, and registration in the EU database for high-risk AI systems.", why:"These make compliance visible and traceable.", tags:["euaiact","ce-marking"]},
    {front:"How do the EU AI Act and GDPR interact?", back:"They apply in parallel — if an AI system processes personal data, GDPR obligations (lawful basis, rights, DPIA) apply on top of the AI Act's requirements.", why:"AI compliance rarely lives in one legal box.", tags:["euaiact","gdpr","overlap"]},
    {front:"Contrast the EU, US and UK approaches to AI regulation.", back:"EU = comprehensive binding law (AI Act); US = no single federal law, sectoral rules plus voluntary NIST AI RMF and executive action; UK = principles-based, delivered through existing regulators.", why:"AIGP is global — you must compare regimes, not just the EU.", tags:["ai-governance","global","aigp"]},
