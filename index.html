    {front:"Name a few key controls in ISO 42001's Annex A.", back:"An AI policy, defined roles/responsibilities, AI impact assessment, data management for AI, controls across the AI system lifecycle, and third-party/supplier management.", why:"They operationalise responsible-AI governance concretely.", tags:["42001","controls"]},
    {front:"What are common generative-AI-specific risks?", back:"Hallucination (confident wrong output), prompt injection, sensitive-data leakage, IP/copyright exposure, and over-reliance by users.", why:"GenAI adds failure modes traditional software governance never faced.", tags:["ai-governance","genai"]},
  ]},

  { id:"gdpr", name:"GDPR", group:"Standards", defaultOn:false, cards:[
    {front:"The six lawful bases for processing under GDPR?", back:"Consent, Contract, Legal obligation, Vital interests, Public task, Legitimate interests.", why:"No processing is lawful without one — it's the first question a regulator asks.", tags:["gdpr","lawful-basis"]},
    {front:"The seven data-protection principles?", back:"Lawfulness/fairness/transparency, Purpose limitation, Data minimisation, Accuracy, Storage limitation, Integrity & confidentiality (security), and Accountability.", why:"Every GDPR obligation traces back to one of these principles.", tags:["gdpr","principles"]},
    {front:"What does 'accountability' require under GDPR?", back:"You must not only comply but be able to *demonstrate* compliance — via records, DPIAs, policies and governance.", why:"'We were compliant' isn't enough; you must prove it.", tags:["gdpr","accountability"]},
    {front:"Controller vs processor?", back:"Controller decides the purposes and means of processing; processor acts only on the controller's documented instructions.", why:"Liability and obligations differ sharply between the two roles.", tags:["gdpr","roles"]},
    {front:"What is special category data?", back:"Sensitive data (health, race/ethnicity, political/religious beliefs, sexual orientation, biometrics for ID, genetics, trade-union membership) needing an extra Article 9 condition to process.", why:"It carries stricter rules and higher breach impact.", tags:["gdpr","special-category"]},
    {front:"GDPR breach notification deadline to the regulator?", back:"Without undue delay and where feasible within 72 hours of becoming aware, unless the breach is unlikely to risk individuals' rights.", why:"Missing the 72-hour window is itself a compliance failure.", tags:["gdpr","breach"]},
    {front:"When must you notify affected individuals of a breach?", back:"Without undue delay when the breach is likely to result in a *high risk* to their rights and freedoms.", why:"The trigger for telling people is higher than for telling the regulator.", tags:["gdpr","breach"]},
    {front:"List the main data-subject rights.", back:"Access, Rectification, Erasure, Restriction of processing, Data portability, Objection, and rights around automated decision-making/profiling.", why:"You must have processes to action each on request.", tags:["gdpr","rights"]},
    {front:"When does the 'right to erasure' apply?", back:"When data is no longer needed, consent is withdrawn, processing was unlawful, or the person objects with no overriding grounds — it's conditional, not absolute.", why:"It can be refused where you have a legal basis to keep the data.", tags:["gdpr","rights"]},
    {front:"When is a DPIA required?", back:"When processing is likely to result in high risk — e.g. large-scale special-category data, systematic monitoring, or new technologies like AI profiling.", why:"Skipping a required DPIA is itself a breach of GDPR.", tags:["gdpr","dpia"]},
    {front:"When must you appoint a DPO?", back:"For public authorities, or where core activities involve large-scale systematic monitoring or large-scale special-category/criminal data.", why:"The DPO is an independent adviser, not the accountable owner.", tags:["gdpr","dpo"]},
    {front:"What makes consent valid under GDPR?", back:"It must be freely given, specific, informed, and unambiguous — a clear affirmative act, and as easy to withdraw as to give.", why:"Pre-ticked boxes and bundled consent don't count.", tags:["gdpr","consent"]},
    {front:"What is a legitimate interests assessment (LIA)?", back:"A three-part test — is there a legitimate interest, is processing necessary for it, and do the individual's rights override it?", why:"Legitimate interests is flexible but requires you to balance and document.", tags:["gdpr","legitimate-interest"]},
    {front:"How can personal data be transferred outside the EEA?", back:"Via an adequacy decision, appropriate safeguards (Standard Contractual Clauses, Binding Corporate Rules), or a specific derogation.", why:"International transfers are a frequent compliance gap.", tags:["gdpr","transfers"]},
    {front:"What did 'Schrems II' change?", back:"It invalidated the EU–US Privacy Shield and required transfer-impact assessments plus supplementary measures when relying on SCCs.", why:"You can't assume a mechanism is safe without assessing the destination country.", tags:["gdpr","transfers","schrems"]},
    {front:"What are the GDPR fine tiers?", back:"Up to €20M or 4% of global annual turnover (whichever is higher) for serious breaches; up to €10M or 2% for lesser ones.", why:"The turnover basis is what makes GDPR fines existential for big firms.", tags:["gdpr","fines"]},
    {front:"What are Records of Processing Activities (Article 30)?", back:"Documentation of what personal data you process, why, categories, recipients, transfers and retention.", why:"They're a core accountability requirement regulators ask for first.", tags:["gdpr","records"]},
    {front:"Privacy by design and by default?", back:"Build data protection into systems from the start (by design) and default to the most privacy-protective settings (by default).", why:"Privacy can't be bolted on afterward — it's an Article 25 obligation.", tags:["gdpr","privacy-by-design"]},
    {front:"Pseudonymisation vs anonymisation?", back:"Pseudonymised data can be re-identified with extra info (still personal data); anonymised data cannot be re-identified (outside GDPR scope).", why:"Only true anonymisation removes data from GDPR's reach.", tags:["gdpr","pseudonymisation"]},
    {front:"What is the territorial scope of GDPR (Article 3)?", back:"It applies to processing by an EU establishment, and to non-EU organisations offering goods/services to, or monitoring, people in the EU.", why:"GDPR reaches far beyond Europe's borders.", tags:["gdpr","scope"]},
    {front:"What must an Article 28 processor contract (DPA) include?", back:"Processing only on documented instructions, confidentiality, security measures, sub-processor rules, assistance to the controller, deletion/return of data, and audit rights.", why:"Sharing data with a processor without a compliant DPA is a breach.", tags:["gdpr","processor","dpa"]},
    {front:"What are joint controllers (Article 26)?", back:"Two or more controllers that jointly determine purposes and means; they must arrange, transparently, who handles which GDPR obligations.", why:"Individuals can exercise rights against any joint controller.", tags:["gdpr","controllers"]},
    {front:"How quickly must you answer a Subject Access Request?", back:"Within one month of receipt (extendable by two further months for complex/numerous requests), usually free of charge.", why:"Missing the deadline is a common, easily-avoided violation.", tags:["gdpr","sar","rights"]},
    {front:"What does Article 22 say about automated decisions?", back:"Individuals have the right not to be subject to a decision based solely on automated processing (incl. profiling) that has legal or similarly significant effects, with limited exceptions and safeguards.", why:"It's the GDPR hook most relevant to AI decision systems.", tags:["gdpr","automated-decisions","ai"]},
    {front:"How does GDPR treat children's data / consent age?", back:"For information-society services the consent age is 16 by default, but member states may lower it to no less than 13; children's data gets extra protection.", why:"Age of consent varies by country — you must check locally.", tags:["gdpr","children"]},
    {front:"Must you record breaches you don't report?", back:"Yes — you must document all personal-data breaches internally (facts, effects, remedial action), even those not notified to the regulator.", why:"The breach register itself is evidence of accountability.", tags:["gdpr","breach","records"]},
    {front:"What is the lead supervisory authority / one-stop-shop?", back:"For cross-border processing, the authority of your main establishment leads, coordinating with other concerned authorities via the consistency mechanism.", why:"It gives multinationals a single primary regulator.", tags:["gdpr","authority"]},
    {front:"What does the EDPB do?", back:"The European Data Protection Board ensures consistent GDPR application across the EU, issues guidance and resolves disputes between authorities.", why:"Its guidance shapes how the law is interpreted in practice.", tags:["gdpr","edpb"]},
    {front:"When must a non-EU organisation appoint an EU representative?", back:"Under Article 27, when GDPR applies to them via Article 3(2) (offering goods/services to, or monitoring, people in the EU), with narrow exemptions.", why:"It gives EU individuals and regulators a local point of contact.", tags:["gdpr","representative","scope"]},
    {front:"What are codes of conduct and certification (Art 40-42)?", back:"Voluntary mechanisms to demonstrate compliance — approved sector codes and certification schemes that provide evidence of good practice.", why:"They're accountability tools, not a get-out from GDPR.", tags:["gdpr","accountability"]},
    {front:"How do ePrivacy / PECR rules relate to GDPR?", back:"They separately govern cookies, tracking and electronic direct marketing; consent for cookies and marketing sits under ePrivacy, alongside GDPR.", why:"A lawful basis under GDPR doesn't override the cookie/marketing consent rules.", tags:["gdpr","eprivacy","cookies"]},
    {front:"What is the right to object to direct marketing?", back:"An absolute right — if a person objects to processing for direct marketing, you must stop, with no balancing test.", why:"Unlike other objections, there's no overriding-interest defense.", tags:["gdpr","marketing","rights"]},
  ]},

  { id:"pdpl", name:"Bahrain PDPL", group:"Standards", defaultOn:false, cards:[
    {front:"What is the Bahrain PDPL?", back:"Bahrain's Personal Data Protection Law (Law No. 30 of 2018, effective Aug 2019) — a GDPR-style regime governing processing of personal data in Bahrain.", why:"It's the baseline privacy obligation for operating in the Bahrain market.", tags:["bahrain-pdpl","privacy"]},
    {front:"Who supervises the Bahrain PDPL?", back:"The Personal Data Protection Authority (PDPA), the regulator responsible for oversight and enforcement.", why:"Knowing the regulator matters for notifications and complaints.", tags:["bahrain-pdpl","authority"]},
    {front:"DISTINCTION — Bahrain PDPL vs Saudi PDPL?", back:"They are *separate national laws*. Saudi Arabia has its own PDPL enforced by SDAIA; Bahrain's is a different statute with its own authority and rules — don't treat them as one Gulf regime.", why:"Assuming one GCC privacy law exists is a costly market mistake.", tags:["bahrain-pdpl","saudi-pdpl","distinction"]},
    {front:"What is a 'data protection guardian' under Bahrain PDPL?", back:"An accountable person/role that certain data managers must appoint to oversee compliance — broadly analogous to GDPR's DPO.", why:"It's a Bahrain-specific accountability mechanism to know by name.", tags:["bahrain-pdpl","roles"]},
    {front:"Does Bahrain PDPL restrict cross-border transfers?", back:"Yes — transferring personal data outside Bahrain generally requires an adequate level of protection or authority approval.", why:"Cross-border rules catch cloud and outsourcing arrangements.", tags:["bahrain-pdpl","transfers"]},
    {front:"How does Bahrain PDPL treat sensitive personal data?", back:"It gives special-category data (health, beliefs, race, etc.) heightened protection and stricter processing conditions.", why:"Same idea as GDPR special categories — extra care required.", tags:["bahrain-pdpl","sensitive"]},
    {front:"What data-subject rights does Bahrain PDPL grant?", back:"Rights broadly like GDPR's — to be informed, access, rectify, object to processing (including for direct marketing), and not be subject to certain automated decisions.", why:"Individuals can enforce these against data managers.", tags:["bahrain-pdpl","rights"]},
    {front:"What's notable about Bahrain PDPL penalties?", back:"It carries not just fines but potential *criminal* liability, including imprisonment for serious violations.", why:"The criminal dimension raises the stakes beyond a GDPR-style fine.", tags:["bahrain-pdpl","penalties"]},
    {front:"Is consent central to Bahrain PDPL?", back:"Yes — processing generally needs the data subject's consent unless another lawful ground applies, mirroring GDPR-style bases.", why:"Consent handling is a first-order compliance task.", tags:["bahrain-pdpl","consent"]},
    {front:"Why is Bahrain PDPL a career differentiator in-region?", back:"Local data-protection expertise is scarcer than GDPR knowledge, so it stands out for Bahrain-market GRC/privacy roles.", why:"Regional regulatory depth is a genuine market edge.", tags:["bahrain-pdpl","career"]},
    {front:"Who is a 'data manager' under Bahrain PDPL?", back:"The person or entity that determines the purpose and means of processing personal data — broadly equivalent to GDPR's controller.", why:"The data manager carries the core legal obligations.", tags:["bahrain-pdpl","roles"]},
    {front:"Does Bahrain PDPL require notifying/registering processing?", back:"Yes — data managers must notify the Authority of certain processing, and sensitive-data or automated processing can require prior authorization.", why:"Some processing can't lawfully start until the Authority is informed.", tags:["bahrain-pdpl","notification"]},
    {front:"What lawful grounds allow processing under Bahrain PDPL?", back:"Consent is the default, with exceptions such as performing a contract, meeting a legal obligation, protecting vital interests, or the data manager's legitimate interests.", why:"Like GDPR, consent isn't the only route — but it's the primary one.", tags:["bahrain-pdpl","lawful-basis"]},
    {front:"What security duties does Bahrain PDPL place on data managers?", back:"Implement appropriate technical and organisational measures to protect personal data against unauthorised access, loss or disclosure.", why:"Security is a direct legal obligation, not optional hygiene.", tags:["bahrain-pdpl","security"]},
    {front:"What rights can individuals exercise, and against whom?", back:"To be informed, access, correct, and object (including to direct marketing and certain automated decisions) — exercised against the data manager, with recourse to the Authority.", why:"Data managers must have processes to action these.", tags:["bahrain-pdpl","rights"]},
    {front:"How does Bahrain PDPL restrict automated processing?", back:"Individuals can object to decisions taken solely by automated processing of their data, similar in spirit to GDPR Article 22.", why:"Automated decisioning needs a human-review safety valve.", tags:["bahrain-pdpl","automated"]},
    {front:"What is the territorial scope of Bahrain PDPL?", back:"It applies to processing by data managers based in Bahrain, and to those outside Bahrain who process personal data using means located in Bahrain.", why:"Foreign firms using Bahrain-based infrastructure can be caught.", tags:["bahrain-pdpl","scope"]},
    {front:"Bahrain PDPL vs GDPR — quick contrast?", back:"Similar principles and rights, but Bahrain adds criminal penalties (incl. imprisonment), uses 'data manager' and a 'data protection guardian', and has its own regulator (PDPA) — it's not GDPR.", why:"Assuming GDPR compliance equals Bahrain compliance is a trap.", tags:["bahrain-pdpl","gdpr","distinction"]},
  ]},

  { id:"pci", name:"PCI DSS", group:"Standards", defaultOn:false, cards:[
    {front:"What is PCI DSS and who must follow it?", back:"Payment Card Industry Data Security Standard — a contractual security standard for any entity that stores, processes or transmits cardholder data.", why:"It's enforced by the card brands/acquirers, not government — but non-compliance means fines or losing card processing.", tags:["pci","scope"]},
    {front:"What are the 6 goals / 12 requirements structure?", back:"Six control objectives (e.g. build/maintain a secure network, protect cardholder data, vulnerability management, access control, monitoring/testing, security policy) broken into 12 requirements.", why:"The 12 requirements are the exam-and-audit backbone of PCI.", tags:["pci","requirements"]},
    {front:"Cardholder Data (CHD) vs Sensitive Authentication Data (SAD)?", back:"CHD = PAN, cardholder name, expiry, service code. SAD = full track data, CVV/CVC, and PINs.", why:"They're protected differently — and SAD has a hard storage ban.", tags:["pci","data"]},
    {front:"What can you never store after authorization?", back:"Sensitive Authentication Data — full magnetic-stripe/track data, the card verification value (CVV/CVC), and the PIN/PIN block.", why:"Storing SAD post-auth is one of the most serious PCI violations.", tags:["pci","storage"]},
    {front:"Can you store the PAN, and how?", back:"Yes, but it must be rendered unreadable — e.g. strong encryption, truncation, tokenization or hashing.", why:"Unprotected PAN storage is a primary breach target.", tags:["pci","pan"]},
    {front:"What is an SAQ?", back:"Self-Assessment Questionnaire — a validation tool letting eligible smaller merchants attest to PCI DSS compliance without a full external audit.", why:"Your SAQ type depends on how you handle card data.", tags:["pci","validation"]},
    {front:"What are PCI merchant levels?", back:"Levels 1–4 based on annual card transaction volume; Level 1 (largest) needs an on-site assessment, lower levels can typically self-assess.", why:"Volume determines whether a QSA audit or an SAQ applies.", tags:["pci","levels"]},
    {front:"What is a QSA and an ASV?", back:"QSA = Qualified Security Assessor (does on-site PCI assessments); ASV = Approved Scanning Vendor (runs required external vulnerability scans).", why:"Different validation activities need different accredited parties.", tags:["pci","roles"]},
    {front:"ROC vs AOC?", back:"ROC = Report on Compliance (detailed assessment result, usually Level 1); AOC = Attestation of Compliance (the summary declaration of the outcome).", why:"The AOC is what you typically share with partners as proof.", tags:["pci","validation"]},
    {front:"Why is network segmentation emphasised in PCI?", back:"Isolating the cardholder data environment (CDE) from the rest of the network shrinks what's in scope for assessment.", why:"Less in scope = less cost and lower breach exposure.", tags:["pci","segmentation"]},
    {front:"What's new/central in PCI DSS 4.0?", back:"The current major version modernises requirements with more flexibility (a 'customised approach'), stronger authentication (MFA), and continuous-security emphasis over point-in-time checks.", why:"4.x replaced 3.2.1 as the standard organisations must meet.", tags:["pci","4.0"]},
    {front:"Does PCI require penetration testing?", back:"Yes — regular internal and external penetration testing, plus segmentation testing to confirm the CDE is properly isolated.", why:"It validates that controls actually hold up against attack.", tags:["pci","testing"]},
    {front:"What are PCI DSS's six control goals?", back:"Build & maintain a secure network; protect cardholder data; maintain a vulnerability-management program; implement strong access control; regularly monitor & test networks; and maintain an information-security policy.", why:"The 12 requirements all roll up into these six goals.", tags:["pci","goals"]},
    {front:"Tokenization vs encryption for card data?", back:"Encryption transforms the PAN reversibly with a key; tokenization replaces it with a non-sensitive token that has no mathematical relationship to the PAN.", why:"Tokenization can remove systems from PCI scope entirely.", tags:["pci","tokenization"]},
    {front:"What is P2PE?", back:"Point-to-Point Encryption — card data is encrypted at the point of capture and only decrypted at a secure endpoint, so the merchant never handles clear card data.", why:"A validated P2PE solution dramatically shrinks PCI scope.", tags:["pci","p2pe"]},
    {front:"How often are ASV scans and penetration tests required?", back:"External vulnerability scans by an ASV at least quarterly (and after significant change); penetration testing at least annually and after significant changes.", why:"PCI treats testing as a recurring, not one-off, obligation.", tags:["pci","testing"]},
    {front:"What does 'in scope' (the CDE) mean for PCI?", back:"The Cardholder Data Environment — all people, processes and systems that store, process, transmit, or can affect the security of cardholder data.", why:"Everything connected to the CDE is in scope unless properly segmented.", tags:["pci","scope"]},
    {front:"Can PCI use compensating controls?", back:"Yes — where a requirement can't be met directly, a documented compensating control providing equivalent protection may be accepted, with justification.", why:"It allows flexibility without lowering the security bar.", tags:["pci","compensating"]},
  ]},

  { id:"soc2", name:"SOC 2", group:"Standards", defaultOn:false, cards:[
    {front:"What are the five SOC 2 Trust Services Criteria?", back:"Security, Availability, Processing Integrity, Confidentiality, Privacy. Security is always included; the rest are optional by scope.", why:"Customers pick which criteria matter for the service they rely on.", tags:["soc2","tsc"]},
    {front:"SOC 2 Type I vs Type II?", back:"Type I tests control *design* at a point in time. Type II tests design *and operating effectiveness* over a period (e.g. 6–12 months).", why:"Type II is far stronger assurance — it proves controls actually ran.", tags:["soc2","type"]},
    {front:"Who performs and issues a SOC 2 report?", back:"A licensed CPA firm, under the AICPA's attestation standards (SSAE 18).", why:"SOC 2 is an attestation by an accountant, not a certification.", tags:["soc2","aicpa"]},
    {front:"SOC 1 vs SOC 2 vs SOC 3?", back:"SOC 1 = controls over financial reporting (ICFR); SOC 2 = security/availability/etc. (restricted-use, detailed); SOC 3 = a public, general-use summary of SOC 2.", why:"Choosing the wrong SOC report answers the wrong question.", tags:["soc2","soc-family"]},
    {front:"What is the 'common criteria' in SOC 2?", back:"The Security TSC maps to the common criteria that every SOC 2 must cover — the mandatory baseline all reports share.", why:"You can't scope out Security; it's the foundation.", tags:["soc2","common-criteria"]},
    {front:"What are CUECs?", back:"Complementary User Entity Controls — controls the report assumes *the customer* implements for the overall system to be secure.", why:"Assurance is shared: the vendor's controls only work if you do your part.", tags:["soc2","cuec"]},
    {front:"How does SOC 2 handle subservice organizations?", back:"Via the carve-out method (excludes the sub-provider's controls, noting them) or the inclusive method (audits them within the report).", why:"It clarifies whether a fourth party (e.g. the vendor's cloud host) is covered.", tags:["soc2","subservice"]},
    {front:"What is a 'bridge letter'?", back:"A gap letter from the service org covering the period between the end of a SOC 2 report and the customer's reliance date, affirming no material changes.", why:"It fills the assurance gap until the next report is issued.", tags:["soc2","bridge-letter"]},
    {front:"Is SOC 2 a certification?", back:"No — it's an attestation report expressing an auditor's opinion. There's no 'SOC 2 certificate'.", why:"Calling it a certification is a common but telling mistake.", tags:["soc2","attestation"]},
    {front:"What's in a SOC 2 report?", back:"The auditor's opinion, management's assertion, a system description, and the detailed controls tested with results (in a Type II).", why:"Customers read the exceptions/test results, not just the opinion.", tags:["soc2","report"]},
    {front:"SOC 2 vs ISO 27001 — key difference?", back:"SOC 2 is a US attestation report (auditor's opinion on your controls against the Trust Services Criteria); ISO 27001 is an international certification of a management system (ISMS).", why:"Customers may ask for one, the other, or both depending on region.", tags:["soc2","iso27001","compare"]},
    {front:"What is a SOC 2 readiness (gap) assessment?", back:"A pre-audit review that identifies control gaps against the TSC so you can remediate before the formal audit.", why:"It de-risks the real audit and avoids a qualified opinion.", tags:["soc2","readiness"]},
    {front:"What is a qualified SOC 2 opinion?", back:"An opinion noting exceptions — one or more controls didn't operate effectively — rather than a clean 'unqualified' pass.", why:"Customers read the exceptions closely, not just the headline.", tags:["soc2","opinion"]},
    {front:"Who typically reads a SOC 2 report, and why is it restricted-use?", back:"Customers and their auditors, to assess a vendor's controls; it's restricted-use because it contains detailed control and system information (SOC 3 is the public version).", why:"It's assurance for informed parties, not marketing.", tags:["soc2","audience"]},
    {front:"What is the 'system description' in a SOC 2 report?", back:"Management's description of the service, its boundaries, infrastructure, and the controls in place — the thing the auditor tests against.", why:"An inaccurate description undermines the whole report.", tags:["soc2","system-description"]},
    {front:"How often should a SOC 2 Type II be renewed?", back:"Typically annually, covering a continuous review period (often 12 months), sometimes with a bridge letter to cover gaps.", why:"Assurance is only as current as the latest report period.", tags:["soc2","cadence"]},
  ]},

  { id:"hipaa", name:"HIPAA", group:"Standards", defaultOn:false, cards:[
    {front:"What is PHI under HIPAA?", back:"Protected Health Information — individually identifiable health data held or transmitted by a covered entity or business associate.", why:"PHI is the exact data HIPAA's rules protect.", tags:["hipaa","phi"]},
    {front:"HIPAA Privacy Rule vs Security Rule?", back:"Privacy Rule governs use/disclosure of all PHI; Security Rule sets safeguards specifically for electronic PHI (ePHI).", why:"Security Rule is the technical/administrative controls piece.", tags:["hipaa","rules"]},
    {front:"What three safeguard categories does the Security Rule require?", back:"Administrative, Physical, and Technical safeguards for ePHI.", why:"Compliance means covering all three, not just technical tools.", tags:["hipaa","safeguards"]},
    {front:"Covered entity vs business associate?", back:"Covered entity = provider/health plan/clearinghouse handling PHI directly; business associate = a vendor handling PHI on their behalf, bound by a BAA.", why:"Business associates carry direct HIPAA liability too.", tags:["hipaa","roles"]},
    {front:"What is a BAA?", back:"Business Associate Agreement — a required contract binding a vendor that handles PHI to HIPAA's safeguards and breach duties.", why:"Sharing PHI without a BAA is itself a violation.", tags:["hipaa","baa"]},
    {front:"What is the 'minimum necessary' standard?", back:"Use or disclose only the least PHI needed to accomplish the purpose.", why:"It limits over-sharing even within authorised uses.", tags:["hipaa","minimum-necessary"]},
    {front:"What does TPO permit?", back:"PHI can be used/disclosed without extra authorization for Treatment, Payment, and healthcare Operations.", why:"It's the everyday lawful basis for using PHI in care delivery.", tags:["hipaa","tpo"]},
    {front:"HIPAA Breach Notification Rule timing?", back:"Notify affected individuals without unreasonable delay and no later than 60 days; notify HHS (and media if 500+ affected in a state/jurisdiction).", why:"The 500 threshold triggers prompt, public reporting.", tags:["hipaa","breach"]},
    {front:"Two ways to de-identify PHI?", back:"Safe Harbor (remove 18 specified identifiers) or Expert Determination (a qualified expert certifies re-identification risk is very small).", why:"De-identified data falls outside HIPAA's restrictions.", tags:["hipaa","de-identification"]},
    {front:"Who enforces HIPAA?", back:"The HHS Office for Civil Rights (OCR), which investigates complaints and can levy penalties.", why:"OCR settlements set the practical bar for 'reasonable' security.", tags:["hipaa","enforcement"]},
    {front:"What did the HITECH Act do?", back:"Strengthened HIPAA — introduced the Breach Notification Rule, extended direct liability to business associates, and increased penalties.", why:"It gave HIPAA real teeth and modern breach duties.", tags:["hipaa","hitech"]},
    {front:"Name key patient rights under HIPAA.", back:"Right to access and get copies of their records, request amendments, an accounting of disclosures, and request restrictions.", why:"Access rights are among OCR's most-enforced areas.", tags:["hipaa","rights"]},
    {front:"Give examples of HIPAA Administrative safeguards.", back:"Security risk analysis, workforce training and access management, assigned security responsibility, contingency planning, and business-associate agreements.", why:"Administrative safeguards are the largest, most-cited safeguard category.", tags:["hipaa","administrative"]},
    {front:"Give examples of HIPAA Physical safeguards.", back:"Facility access controls, workstation use/security policies, and device & media controls (disposal, reuse, backup).", why:"They protect the physical places and hardware holding ePHI.", tags:["hipaa","physical"]},
    {front:"Give examples of HIPAA Technical safeguards.", back:"Access control (unique IDs, emergency access), audit controls, integrity controls, transmission security, and encryption (an addressable spec).", why:"These are the logical/IT controls over ePHI.", tags:["hipaa","technical"]},
    {front:"Required vs addressable implementation specs?", back:"Required specs must be implemented; addressable specs must be implemented if reasonable/appropriate, otherwise you document why and adopt an equivalent alternative.", why:"'Addressable' does NOT mean optional — a common misconception.", tags:["hipaa","addressable"]},
    {front:"What is the HIPAA risk analysis requirement?", back:"Covered entities and business associates must conduct an accurate, thorough assessment of risks to ePHI — the foundational Security Rule obligation.", why:"OCR cites a missing/inadequate risk analysis in most enforcement cases.", tags:["hipaa","risk-analysis"]},
    {front:"How are HIPAA civil penalties structured?", back:"In tiers based on culpability — from 'did not know' up to 'willful neglect not corrected' — with escalating per-violation and annual maximums.", why:"Willful neglect that goes uncorrected draws the harshest fines.", tags:["hipaa","penalties"]},
  ]},

  { id:"adjsec", name:"Adjacent security (not compliance)", group:"Adjacent", defaultOn:false, adjacent:true, cards:[
    {front:"What is the OWASP Top 10?", back:"A regularly updated awareness list of the most critical web-application security risks.", why:"It's guidance for secure design, not a compliance standard.", tags:["owasp","appsec"]},
    {front:"What tops the OWASP Top 10 (2021)?", back:"A01 Broken Access Control — followed by Cryptographic Failures, Injection, Insecure Design, and Security Misconfiguration.", why:"Access-control flaws became the single most common serious web risk.", tags:["owasp","appsec"]},
    {front:"What is SSRF (in the OWASP Top 10)?", back:"Server-Side Request Forgery — tricking a server into making requests to unintended internal/external resources.", why:"It's a rising risk as apps fetch URLs and talk to cloud metadata services.", tags:["owasp","ssrf"]},
    {front:"What is the OWASP Top 10 for LLM Applications?", back:"A separate list of the most critical risks specific to large-language-model apps.", why:"Classic web risks don't capture how LLMs actually break.", tags:["owasp-llm","ai-security"]},
    {front:"What is prompt injection (LLM01)?", back:"Manipulating an LLM via crafted input so it ignores its instructions or performs unintended actions — directly or via poisoned content it reads.", why:"It's the signature, hardest-to-fully-solve LLM vulnerability.", tags:["owasp-llm","prompt-injection"]},
    {front:"Name other top LLM application risks.", back:"Sensitive information disclosure, insecure output handling, training-data poisoning, supply-chain vulnerabilities, excessive agency, and model/resource exhaustion (DoS).", why:"LLM security spans the data, model, and how outputs are trusted.", tags:["owasp-llm","ai-security"]},
    {front:"What is MITRE ATLAS?", back:"Adversarial Threat Landscape for Artificial-Intelligence Systems — a knowledge base of real-world tactics and techniques used to attack ML systems.", why:"It gives a shared taxonomy for AI/ML attacks.", tags:["atlas","ai-security"]},
    {front:"MITRE ATT&CK vs ATLAS?", back:"ATT&CK catalogues adversary tactics/techniques against traditional IT systems; ATLAS is its counterpart focused on AI/ML systems.", why:"They're companion matrices for different attack surfaces.", tags:["atlas","attack"]},
    {front:"What is Zero Trust (in one line)?", back:"'Never trust, always verify' — no implicit trust from network location; every access is authenticated, authorised and continuously validated.", why:"An architecture/assessment model, not a compliance standard.", tags:["zero-trust","architecture"]},
    {front:"The core principles of Zero Trust?", back:"Verify explicitly, use least-privilege access, and assume breach.", why:"They flip security from perimeter trust to per-request verification.", tags:["zero-trust","principles"]},
    {front:"What standard defines Zero Trust Architecture?", back:"NIST SP 800-207 — it describes ZTA concepts and the policy engine / policy administrator / policy enforcement point model.", why:"It's the reference many ZTA programs cite.", tags:["zero-trust","800-207"]},
    {front:"What is microsegmentation?", back:"Dividing a network into small, isolated zones so a compromise can't move laterally across the whole environment.", why:"It's a key mechanism for enforcing Zero Trust internally.", tags:["zero-trust","segmentation"]},
    {front:"CVE vs CVSS?", back:"CVE = a unique identifier for a specific known vulnerability; CVSS = a 0–10 score rating that vulnerability's severity.", why:"CVE names the flaw; CVSS helps you prioritise it.", tags:["vuln","cve"]},
    {front:"What is STRIDE threat modeling?", back:"A model categorising threats as Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, and Elevation of privilege.", why:"It gives a structured way to find design-level threats early.", tags:["threat-modeling","stride"]},
    {front:"Name more of the OWASP Top 10 (2021) beyond the leaders.", back:"Insecure Design, Security Misconfiguration, Vulnerable & Outdated Components, Identification & Authentication Failures, Software & Data Integrity Failures, Security Logging & Monitoring Failures, and SSRF.", why:"'Insecure Design' being new stresses building security in, not bolting it on.", tags:["owasp","appsec"]},
    {front:"What is 'excessive agency' and 'overreliance' in LLM apps?", back:"Excessive agency = giving an LLM too much autonomy/permissions so it can take harmful actions; overreliance = users trusting LLM output without verification.", why:"Both are governance/design failures, not model bugs.", tags:["owasp-llm","ai-security"]},
    {front:"What are the core tenets of Zero Trust (NIST 800-207)?", back:"Treat all resources as untrusted, secure all communications, grant per-session least-privilege access via dynamic policy, and continuously monitor and authenticate.", why:"Trust is never granted by network location, only earned per request.", tags:["zero-trust","800-207"]},
    {front:"ZTNA vs VPN?", back:"A VPN grants broad network access once connected; Zero Trust Network Access grants access to specific applications per verified identity/context, hiding everything else.", why:"ZTNA shrinks lateral movement a VPN would allow.", tags:["zero-trust","ztna"]},
    {front:"What do the CVSS severity bands mean?", back:"0.0 none, 0.1-3.9 low, 4.0-6.9 medium, 7.0-8.9 high, 9.0-10.0 critical.", why:"The band drives how urgently a vulnerability must be patched.", tags:["vuln","cvss"]},
    {front:"What is a supply-chain attack?", back:"Compromising a trusted vendor, library or update mechanism to reach that vendor's many downstream customers at once.", why:"It turns one breach into thousands — a top governance concern.", tags:["supply-chain","threats"]},
  ]},
];

/* ---------- state ---------- */
const STORE_KEY = "anchor.v1";
const DAY = 86400000;
const todayNum = () => Math.floor(Date.now()/DAY);

let DECKS = [];         // decks with cards + ids assigned
let state = load();     // persisted state

function blankState(){
  const enabled = {};
  SEED_DECKS.forEach(d => enabled[d.id] = true);   // learn-all: every deck on by default
  return { progress:{}, enabled, streak:{count:0,last:null}, reviews:[], custom:[], newDay:{day:null,count:0} };
}
function load(){
  try{ const s = JSON.parse(localStorage.getItem(STORE_KEY)); if(s && s.progress) return {...blankState(), ...s}; }catch(e){}
  return blankState();
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ toast("Couldn't save (storage blocked)","err"); } }
function uid(){ return (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now()+"-"+Math.random().toString(36).slice(2); }

/* ---------- conflict-free merge (for cross-device sync) ---------- */
// Merge two Anchor states without losing progress. Idempotent, order-independent.
function mergeState(a, b){
  if(!b) return a;
  const out = {...blankState()};
  // progress: per card, keep the most recently reviewed version (max ts)
  out.progress = {...(b.progress||{})};
  for(const [id,p] of Object.entries(a.progress||{})){
    const q = out.progress[id];
    if(!q || (p.ts||0) >= (q.ts||0)) out.progress[id] = p;
  }
  // reviews: union by id (dedupe), so re-syncing never double-counts
  const rev = new Map();
  for(const r of [...(b.reviews||[]), ...(a.reviews||[])]){
    const k = r.id || (r.d+"|"+r.r);
    if(!rev.has(k)) rev.set(k, r);
  }
  out.reviews = [...rev.values()].sort((x,y)=>x.d-y.d);
  // enabled decks: enabled if enabled on either device
  out.enabled = {...(b.enabled||{})};
  for(const [k,v] of Object.entries(a.enabled||{})) out.enabled[k] = v || out.enabled[k];
  // custom cards: union by id
  const cust = new Map();
  for(const c of [...(b.custom||[]), ...(a.custom||[])]) cust.set(c.id, c);
  out.custom = [...cust.values()];
  // today's new-card allowance: take the larger count so limits aren't bypassed
  const t = todayNum();
  const an = (a.newDay&&a.newDay.day===t)?a.newDay.count:0;
  const bn = (b.newDay&&b.newDay.day===t)?b.newDay.count:0;
  out.newDay = {day:t, count:Math.max(an,bn)};
  return out;
}

/* build DECKS = seed + custom, assign stable ids */
function buildDecks(){
  DECKS = SEED_DECKS.map(d => ({
    ...d,
    cards: d.cards.map((c,i)=>({...c, id:`${d.id}#${i}`, deckId:d.id, deckName:d.name}))
  }));
  // fold custom cards into their decks
  state.custom.forEach(c=>{
    const deck = DECKS.find(d=>d.id===c.deckId);
    if(deck) deck.cards.push({...c, deckName:deck.name});
  });
}
const allCards = () => DECKS.flatMap(d=>d.cards);
const deckById = id => DECKS.find(d=>d.id===id);
const isEnabled = id => !!state.enabled[id];

/* ---------- SM-2 engine ---------- */
function prog(id){
  return state.progress[id] || {ease:2.5, interval:0, reps:0, due:todayNum(), lapses:0, state:"New", seen:false};
}
function cardState(p){
  if(!p.seen) return "New";
  if(p.interval >= 21) return "Mastered";
  return "Learning";
}
function newDayState(){
  if(!state.newDay || state.newDay.day !== todayNum()) state.newDay = {day:todayNum(), count:0};
  return state.newDay;
}
function newAllowance(){ return Math.max(0, NEW_PER_DAY - newDayState().count); }

function schedule(id, rating){
  const wasNew = !(state.progress[id] && state.progress[id].seen);
  const p = {...prog(id)};
  switch(rating){
    case "again":
      p.reps = 0; p.interval = 0; p.ease = Math.max(1.3, p.ease - 0.20); p.lapses++; break;
    case "hard":
      p.ease = Math.max(1.3, p.ease - 0.15);
      p.interval = p.interval < 1 ? 1 : Math.round(p.interval * 1.2); p.reps++; break;
    case "good":
      if(p.reps === 0) p.interval = 1;
      else if(p.reps === 1) p.interval = 6;
      else p.interval = Math.round(p.interval * p.ease);
      p.reps++; break;
    case "easy":
      p.ease = p.ease + 0.15;
      if(p.reps === 0) p.interval = 4;
      else if(p.reps === 1) p.interval = 8;
      else p.interval = Math.round(p.interval * p.ease * 1.3);
      p.reps++; break;
  }
  p.ease = Math.max(1.3, p.ease);
  p.seen = true;
  p.ts = Date.now();                 // last-reviewed timestamp (for Recap ordering)
  p.due = todayNum() + p.interval;   // interval 0 => due today (relearn)
  p.state = cardState(p);
  state.progress[id] = p;
  state.reviews.push({id:uid(), d:todayNum(), r:rating});
  if(wasNew) newDayState().count++;
  bumpStreak();
  save();
  return p;
}
// preview interval string for the rate buttons (no state change)
function previewInterval(id, rating){
  const p = {...prog(id)};
  let iv;
  if(rating==="again") iv = 0;
  else if(rating==="hard") iv = p.interval < 1 ? 1 : Math.round(p.interval*1.2);
  else if(rating==="good") iv = p.reps===0?1 : p.reps===1?6 : Math.round(p.interval*p.ease);
  else { const e=p.ease+0.15; iv = p.reps===0?4 : p.reps===1?8 : Math.round(p.interval*e*1.3); }
  if(iv<=0) return "now";
  if(iv===1) return "1d";
  if(iv<30) return iv+"d";
  const m = Math.round(iv/30); return m<12 ? m+"mo" : Math.round(iv/365)+"y";
}

function bumpStreak(){
  const t = todayNum();
  const s = state.streak;
  if(s.last === t) return;
  s.count = (s.last === t-1) ? s.count + 1 : 1;
  s.last = t;
}
// streak is DERIVED from the set of days you actually studied, so it stays
// correct after a cross-device merge (which unions those days).
function displayStreak(){
  const days = new Set(state.reviews.map(r=>r.d));
  const t = todayNum();
  if(!days.has(t) && !days.has(t-1)) return 0;   // lapses if you miss today and yesterday
  let day = days.has(t) ? t : t-1, n = 0;
  while(days.has(day)){ n++; day--; }
  return n;
}

/* ---------- queue building ---------- */
const NEW_PER_DAY = 20;
function dueQueue(){
  const t = todayNum();
  const enabledCards = allCards().filter(c=>isEnabled(c.deckId));
  const due = [], fresh = [];
  enabledCards.forEach(c=>{
    const p = prog(c.id);
    if(p.seen){ if(p.due <= t) due.push(c); }
    else fresh.push(c);
  });
  shuffle(due); shuffle(fresh);
  return [...due, ...fresh.slice(0, newAllowance())];
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* deck stats */
function deckStats(deck){
  let nw=0,lr=0,ms=0;
  deck.cards.forEach(c=>{
    const st = cardState(prog(c.id));
    if(st==="New") nw++; else if(st==="Mastered") ms++; else lr++;
  });
  return {nw,lr,ms,total:deck.cards.length};
}

}

function longestStreak(){
  const days = studyDays();
  if(!days.length) return 0;
  let best=1, run=1;
  for(let i=1;i<days.length;i++){
    run = (days[i]===days[i-1]+1) ? run+1 : 1;
    best = Math.max(best, run);
  }
  return best;
}

/* ---------- Recap (review previously-seen cards, no scheduling) ---------- */
function startRecap(){
  const seen = allCards().filter(c=>prog(c.id).seen);
  if(!seen.length){ toast("No studied cards to recap yet — study some first","err"); return; }
  seen.sort((a,b)=>(prog(b.id).ts||0)-(prog(a.id).ts||0));   // most recently reviewed first
  const pool = seen.slice(0, 40);
  quiz = { queue:pool, idx:0, correct:0, missed:[], opts:null, answered:false, chosen:null, recap:true };
  Object.values(views).forEach(v=>v.classList.remove("active"));
  views.quiz.classList.add("active");
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active", b.dataset.view==="quiz"));
  renderQuizCard();
}

/* ---------- Study session (quiz + flip hybrid, Repeat / Next) ---------- */
let session = null;
let studyScope = null;   // deckId to focus a session, or null for all enabled decks

function buildStudyQueue(scope){
  const t = todayNum();
  if(scope){
    const deck = deckById(scope);
    if(!deck) return [];
    const due=[], fresh=[];
    deck.cards.forEach(c=>{ const p=prog(c.id); if(p.seen){ if(p.due<=t) due.push(c); } else fresh.push(c); });
    return [...shuffle(due), ...shuffle(fresh)];   // focused deck: study it all, no daily cap
  }
  return dueQueue();   // global: due + new-card allowance across enabled decks
}
function startSession(scope){
  studyScope = scope || null;
  const q = buildStudyQueue(studyScope);
  if(!q.length){ renderSessionDone(true); return; }
  session = { queue:q, idx:0, total:q.length, done:0, opts:null, phase:"ask", chosen:null,
              history:[], masteredBefore:masteredSnapshot(), scope:studyScope };
  renderCard();
}
function masteredSnapshot(){
  const snap={};
  DECKS.forEach(d=> snap[d.id] = deckStats(d).ms);
  return snap;
}
function renderCard(){
  const s = session;
  if(s.idx >= s.queue.length){ renderSessionDone(false); return; }
  const card = s.queue[s.idx];
  if(s.opts == null){ s.opts = quizOptions(card); s.phase = "ask"; s.chosen = null; }
  const revealed = s.phase !== "ask";
  const pctDone = Math.round(s.done / s.total * 100);

  const optsHtml = s.opts.map((o,i)=>{
    let cls = "quiz-opt";
    if(revealed){

      else cls += " muted";
    }
    return `<button class="${cls}" data-i="${i}" ${revealed?"disabled":""}>
      <span class="opt-k">${i+1}</span><span>${esc(o)}</span></button>`;
  }).join("");

  let bottom;
  if(!revealed){
    bottom = `
      <button class="btn ghost full" id="revealBtn">I don't know — flip to the answer</button>

  } else {

      ? `<span class="dim">Answer revealed</span>`

        <div class="tags">${(card.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>

        <button class="rate again" id="repeatBtn"><span class="lbl">↻ Repeat</span><span class="nxt">see it again today</span></button>
        <button class="rate good" id="nextBtn"><span class="lbl">Next →</span><span class="nxt">back in ${previewInterval(card.id,"good")}</span></button>
      </div>`;
  }

  views.study.querySelector(".study-wrap").innerHTML = `
    <div class="study-meta">
      <span>${s.history.length?`<button class="linkbtn" id="backBtn">← Back</button>`:`<span class="dim">${card.deckName}${s.scope?" · focused":""}</span>`}</span>
      <span>${s.done} / ${s.total}</span>
    </div>
    <div class="progress-bar"><i style="width:${pctDone}%"></i></div>
    <div class="quiz-q">${esc(card.front)}${(card.hint&&!revealed)?`<div style="font-size:13px;color:var(--warn);margin-top:12px;font-family:var(--mono);font-weight:400">💡 ${esc(card.hint)}</div>`:''}</div>
    <div class="quiz-opts">${optsHtml}</div>
    ${bottom}`;

  const bb = document.getElementById("backBtn");
  if(bb) bb.onclick = undo;
  if(!revealed){
    document.querySelectorAll(".quiz-opt").forEach(b=> b.onclick=()=>studyAnswer(s.opts[+b.dataset.i]));
    document.getElementById("revealBtn").onclick = studyReveal;
  } else {
    document.getElementById("repeatBtn").onclick = ()=>advance("again");
    document.getElementById("nextBtn").onclick = ()=>advance("good");

}
function studyAnswer(choice){
  if(!session || session.phase!=="ask") return;
  session.chosen = choice;
  session.phase = "revealed";
  renderCard();
}
function studyReveal(){
  if(!session || session.phase!=="ask") return;
  session.chosen = null;   // flipped without answering = didn't know
  session.phase = "revealed";
  renderCard();
}
function advance(rating){   // rating: "good" (Next) or "again" (Repeat)
  if(!session || session.phase==="ask") return;
  const card = session.queue[session.idx];
  session.history.push({
    idx: session.idx,
    cardId: card.id,
    before: state.progress[card.id] ? JSON.parse(JSON.stringify(state.progress[card.id])) : null,
    rating,
    streakBefore: JSON.parse(JSON.stringify(state.streak)),
    newCountBefore: state.newDay ? state.newDay.count : 0,
    reviewLen: state.reviews.length
  });
  schedule(card.id, rating);
  if(rating==="again"){ session.queue.push(card); }  // Repeat: relearn later this session
  else { session.done++; }
  session.idx++;
  session.opts = null; session.phase = "ask"; session.chosen = null;
  updateStreakPill();
  checkDeckMastery(card.deckId);
  renderCard();
}
function undo(){
  if(!session || !session.history.length) return;
  const h = session.history.pop();
  if(h.before) state.progress[h.cardId] = h.before; else delete state.progress[h.cardId];
  state.reviews.length = Math.max(0, h.reviewLen - 1);
  state.streak = h.streakBefore;
  if(state.newDay) state.newDay.count = h.newCountBefore;
  if(h.rating === "again") session.queue.pop();   // remove the re-queued copy
  else session.done--;
  session.idx = h.idx;
  session.opts = null; session.phase = "ask"; session.chosen = null;   // redo the restored card
  save();
  updateStreakPill();
  renderCard();
}
function updateStreakPill(){
  document.getElementById("streakNum").textContent = displayStreak();
}
function checkDeckMastery(deckId){
  const now = deckStats(deckById(deckId)).ms;
  const before = session.masteredBefore[deckId] ?? 0;
  const total = deckById(deckId).cards.length;
  if(now > before && now === total && total>0){ celebrate(); toast(`🎉 ${deckById(deckId).name} fully mastered!`,"ok"); }
  session.masteredBefore[deckId] = now;
}
function renderSessionDone(nothingDue){
  updateStreakPill();
  const focused = studyScope ? (deckById(studyScope)||{}).name : null;
  views.study.querySelector(".study-wrap").innerHTML = `
    <div class="center-msg">
      <div class="em">${nothingDue?"🌙":"✅"}</div>
      <h2>${nothingDue?(focused?"Caught up on this deck":"You're done for today"):"Session complete"}</h2>
      <p class="dim" style="margin-bottom:22px">${nothingDue
        ? (focused?`No cards from ${esc(focused)} are due right now.`:"No cards are due. Come back tomorrow, or enable more decks.")
        : `You reviewed ${session?session.done:0} card${session&&session.done!==1?'s':''}. Streak: ${displayStreak()} 🔥`}</p>
      <button class="btn primary" onclick="show('dashboard')">Back to dashboard</button>
    </div>`;
}

/* ---------- Mixed Quiz (no scheduling) ---------- */
let quiz = null;
function renderQuizSetup(){
  const enabledDecks = DECKS.filter(d=>d.cards.length);
  views.quiz.querySelector(".study-wrap").innerHTML = `
    <div class="section-title">Mixed quiz — cross-deck self test</div>
    <p class="dim" style="margin-bottom:18px;font-size:13px">Pick decks to mix. This is a no-consequences test — <b>it does not change your spaced-repetition schedule.</b></p>
    <div class="quiz-grid" id="quizDecks">${
      enabledDecks.map(d=>`<label class="deck-check">
        <input type="checkbox" value="${d.id}" ${isEnabled(d.id)?"checked":""}>
        <span>${d.name} <span class="dim">(${d.cards.length})</span></span>
      </label>`).join("")
    }</div>
    <div class="toolbar">
      <label class="field" style="margin:0"><span>How many cards</span>
        <select id="quizCount"><option>10</option><option>20</option><option>30</option><option value="0">All</option></select>
      </label>
    </div>
    <button class="btn primary big" id="startQuiz">Start quiz →</button>`;
  document.getElementById("startQuiz").onclick = startQuiz;
}
function startQuiz(){
  const ids = [...document.querySelectorAll("#quizDecks input:checked")].map(i=>i.value);
  if(!ids.length){ toast("Pick at least one deck","err"); return; }
  let pool = allCards().filter(c=>ids.includes(c.deckId));
  shuffle(pool);
  const n = parseInt(document.getElementById("quizCount").value,10);
  if(n>0) pool = pool.slice(0,n);
  quiz = { queue:pool, idx:0, correct:0, missed:[], opts:null, answered:false, chosen:null };
  renderQuizCard();
}
// build 4 options: the correct answer + 3 distractors (prefer same deck)
function quizOptions(card){
  const correct = card.back;
  const pool = allCards().filter(c => c.id!==card.id && c.back && c.back!==correct);
  const same = shuffle(pool.filter(c => c.deckId===card.deckId));
  const rest = shuffle(pool);
  const picks = [], seen = new Set([correct]);
  for(const c of [...same, ...rest]){
    if(picks.length>=3) break;
    if(!seen.has(c.back)){ picks.push(c.back); seen.add(c.back); }
  }
  return shuffle([correct, ...picks]);
}
function renderQuizCard(){
  const s = quiz;
  if(s.idx >= s.queue.length){ renderQuizDone(); return; }
  const card = s.queue[s.idx];
  if(s.opts == null){ s.opts = quizOptions(card); s.answered = false; s.chosen = null; }
  const optsHtml = s.opts.map((o,i)=>{
    let cls = "quiz-opt";
    if(s.answered){
      if(o===card.back) cls += " correct";
      else if(o===s.chosen) cls += " wrong";
      else cls += " muted";
    }
    return `<button class="${cls}" data-i="${i}" ${s.answered?"disabled":""}>
      <span class="opt-k">${i+1}</span><span>${esc(o)}</span></button>`;
  }).join("");
  const correct = s.chosen===card.back;
  const feedback = s.answered ? `
    <div class="quiz-feedback ${correct?'ok':'no'}">
      <b>${correct?'✓ Correct':'✗ Not quite'}</b>${card.why?` — ${esc(card.why)}`:''}
      <div style="margin-top:14px"><button class="btn primary" id="qNext">${s.idx+1>=s.queue.length?'See results':'Next →'}</button></div>
    </div>` : `<div class="dim" style="text-align:center;font-size:12px;margin-top:14px">Pick an answer — keys 1–4</div>`;
  views.quiz.querySelector(".study-wrap").innerHTML = `
    <div class="study-meta"><span>Mixed quiz · ${card.deckName}</span><span>${s.idx+1} / ${s.queue.length} · score ${s.correct}</span></div>
    <div class="progress-bar"><i style="width:${Math.round(s.idx/s.queue.length*100)}%"></i></div>
    <div class="quiz-q">${esc(card.front)}</div>
    <div class="quiz-opts">${optsHtml}</div>
    ${feedback}`;
  if(!s.answered){
    document.querySelectorAll(".quiz-opt").forEach(b=> b.onclick=()=>quizChoose(s.opts[+b.dataset.i], card));
  } else {
    document.getElementById("qNext").onclick = quizNext;
  }
}
function quizChoose(choice, card){
  if(!quiz || quiz.answered) return;
  quiz.answered = true; quiz.chosen = choice;
  if(choice===card.back) quiz.correct++; else quiz.missed.push(card);
  renderQuizCard();
}
function quizNext(){
  quiz.idx++; quiz.opts = null; quiz.answered = false; quiz.chosen = null;
  renderQuizCard();
}
function renderQuizDone(){
  const pct = quiz.queue.length? Math.round(quiz.correct/quiz.queue.length*100):0;
  const review = quiz.missed.length ? `
    <div class="quiz-review">
      <div class="section-title" style="margin-top:6px">Review — you missed ${quiz.missed.length}</div>
      ${quiz.missed.map(c=>`<div class="miss-card"><div class="q">${esc(c.front)}</div><div class="a">${esc(c.back)}</div></div>`).join("")}
    </div>` : `<p class="dim" style="margin-top:8px">Clean sweep — nothing missed. 🎯</p>`;
  views.quiz.querySelector(".study-wrap").innerHTML = `
    <div class="center-msg" style="padding-bottom:20px">
      <div class="em">${pct>=80?"🏆":pct>=50?"👍":"📚"}</div>
      <h2>${quiz.correct} / ${quiz.queue.length} correct</h2>
      <p class="dim" style="margin-bottom:22px">${pct}% — ${pct>=80?"exam-ready.":pct>=50?"solid, keep drilling.":"worth another pass."}</p>
      <button class="btn primary" onclick="renderQuizSetup()">New quiz</button>
    </div>
    ${review}`;
}

/* ---------- Deck manager ---------- */
function renderDeckTable(){
  const tb = document.getElementById("deckTable");
  tb.innerHTML="";
  DECKS.forEach(d=>{
    const s = deckStats(d);
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><label class="switch"><input type="checkbox" ${isEnabled(d.id)?"checked":""} data-deck="${d.id}"><span class="slider"></span></label></td>
      <td><b>${d.name}</b> ${d.star?'<span class="badge star">cert</span>':''}${d.adjacent?'<span class="badge adj">not compliance</span>':''}<div class="dim" style="font-size:11px">${d.group} · ${s.total} cards</div></td>
      <td>${s.nw}</td><td>${s.lr}</td><td>${s.ms}</td>
      <td class="dim" style="font-size:11px">${d.group}</td>`;
    tb.appendChild(tr);
  });
  tb.querySelectorAll("input[data-deck]").forEach(cb=> cb.onchange=()=>{
    state.enabled[cb.dataset.deck]=cb.checked; save();
  });
}

/* add card modal */
const modal = document.getElementById("cardModal");
document.getElementById("addCardBtn").onclick=()=>{
  const sel = document.getElementById("fDeck");
  sel.innerHTML = DECKS.map(d=>`<option value="${d.id}">${d.name}</option>`).join("");
  ["fFront","fBack","fWhy","fHint","fTags"].forEach(id=>document.getElementById(id).value="");
  modal.classList.add("show");
};
document.getElementById("cancelCard").onclick=()=>modal.classList.remove("show");
modal.onclick=e=>{ if(e.target===modal) modal.classList.remove("show"); };
document.getElementById("saveCard").onclick=()=>{
  const front=document.getElementById("fFront").value.trim();
  const back=document.getElementById("fBack").value.trim();
  if(!front||!back){ toast("Front and back are required","err"); return; }
  const card = {
    id:"custom#"+Date.now(), deckId:document.getElementById("fDeck").value,
    front, back, why:document.getElementById("fWhy").value.trim(),
    hint:document.getElementById("fHint").value.trim(),
    tags:document.getElementById("fTags").value.split(",").map(t=>t.trim()).filter(Boolean)
  };
  state.custom.push(card); save(); buildDecks();
  modal.classList.remove("show"); renderDeckTable();
  toast("Card added ✓","ok");
};

/* export / import / reset */
document.getElementById("exportBtn").onclick=()=>{
  const blob = new Blob([JSON.stringify({version:1, exported:new Date().toISOString(), state},null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download="anchor-backup.json"; a.click();
  URL.revokeObjectURL(url); toast("Exported ✓","ok");
};
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const data=JSON.parse(r.result);
    const incoming = data.state || data;
    if(!incoming.progress) throw new Error("bad file");
    state = {...blankState(), ...incoming};
    save(); buildDecks(); renderDeckTable(); renderDashboard();
    toast("Imported ✓","ok");
  }catch(err){ toast("Invalid backup file","err"); } };
  r.readAsText(f); e.target.value="";
};
document.getElementById("resetBtn").onclick=()=>{
  if(!confirm("Reset all progress and streak? Custom cards are kept.")) return;
  const custom = state.custom, enabled = state.enabled;
  state = blankState(); state.custom=custom; state.enabled=enabled;
  save(); buildDecks(); renderDeckTable(); renderDashboard();
  toast("Progress reset","ok");
};

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e=>{
  if(modal.classList.contains("show")) return;
  const inStudy = views.study.classList.contains("active");
  const inQuiz  = views.quiz.classList.contains("active");
  if(inStudy && session){
    if(session.phase==="ask"){
      if(["1","2","3","4"].includes(e.key)){ const i=+e.key-1; if(session.opts && i<session.opts.length) studyAnswer(session.opts[i]); }
      else if(e.code==="Space" || e.key==="Enter"){ e.preventDefault(); studyReveal(); }
      else if(e.key==="Escape"){ show("dashboard"); }
    } else {
      if(e.key==="1" || e.key.toLowerCase()==="r"){ advance("again"); }        // Repeat
      else if(e.key==="2" || e.code==="Space" || e.key==="Enter" || e.key.toLowerCase()==="n"){ e.preventDefault(); advance("good"); }  // Next
      else if(e.key==="Escape"){ show("dashboard"); }
    }
  }
  if(inQuiz && quiz && quiz.queue){
    if(!quiz.answered && ["1","2","3","4"].includes(e.key)){
      const i = +e.key-1;
      if(quiz.opts && i < quiz.opts.length) quizChoose(quiz.opts[i], quiz.queue[quiz.idx]);
    }
    else if(quiz.answered && (e.key==="Enter" || e.code==="Space")){ e.preventDefault(); quizNext(); }
    else if(e.key==="Escape"){ show("dashboard"); }
  }
});

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
let toastT;
function toast(msg,kind){
  const t=document.getElementById("toast");
  t.textContent=msg; t.className="toast show "+(kind||"");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600);
}
/* tiny confetti */
function celebrate(){
  const cv=document.getElementById("confetti"); const ctx=cv.getContext("2d");
  cv.width=innerWidth; cv.height=innerHeight;
  const cols=["#b37ad4","#4fd6b0","#6a86dd","#e0b34e","#8fb3ff"];
  const bits=Array.from({length:120},()=>({x:Math.random()*cv.width,y:-20,vy:2+Math.random()*4,vx:-2+Math.random()*4,r:3+Math.random()*4,c:cols[~~(Math.random()*cols.length)],a:1}));
  let f=0;
  (function loop(){
    ctx.clearRect(0,0,cv.width,cv.height); f++;
    bits.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; b.vy+=0.05; b.a-=0.008;
      ctx.globalAlpha=Math.max(0,b.a); ctx.fillStyle=b.c; ctx.fillRect(b.x,b.y,b.r,b.r); });
    if(f<160) requestAnimationFrame(loop); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* ---------- boot ---------- */
buildDecks();
renderDashboard();
document.getElementById("streakNum").textContent = displayStreak();

// register the service worker so the app works offline / installs to home screen
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW failed", e)));
}
// pull the latest from the cloud on startup if sync is set up and we're online
if(syncConfigured() && syncCode() && navigator.onLine){ cloudSync(false); }
</script>
